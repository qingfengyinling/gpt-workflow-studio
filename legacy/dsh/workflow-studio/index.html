function openSettings(tab){
  if (tab) UI.settingsTab = tab;
  UI.settingsOpen = true;
  UI.exportOpen = false;
  UI.capture = null;
  document.body.classList.remove('pane-l','pane-r');
  const mask = document.getElementById('mask');
  if (mask) mask.classList.add('on');
  const ep = document.getElementById('exportPanel'), sp = document.getElementById('settingsPanel');
  if (ep) ep.style.display = 'none';
  if (sp) sp.style.display = '';
  refreshAll();
}
function closeSettings(){
  UI.settingsOpen = false;
  UI.capture = null;
  const mask = document.getElementById('mask');
  if (mask) mask.classList.remove('on');
}

function prettyKey(k){
  if (!k) return '未绑定';
  return String(k).split('+').map(p => {
    if (p === 'ctrl') return 'Ctrl';
    if (p === 'alt') return 'Alt';
    if (p === 'shift') return 'Shift';
    if (p === 'space') return '空格';
    if (p === 'up') return '↑';
    if (p === 'down') return '↓';
    if (p === 'left') return '←';
    if (p === 'right') return '→';
    if (p === 'escape') return 'Esc';
    if (p === 'delete') return 'Delete';
    if (p === ',') return ',';
    if (p.length === 1) return p.toUpperCase();
    return p.charAt(0).toUpperCase() + p.slice(1);
  }).join(' + ');
}

function renderSettingsPanel(){
  const bd = document.getElementById('setBd');
  const ft = document.getElementById('setFt');
  if (!bd || !ft) return;
  document.querySelectorAll('.tabs button[data-stab]').forEach(b => {
    b.classList.toggle('on', b.getAttribute('data-stab') === UI.settingsTab);
  });

  if (UI.settingsTab === 'key'){
    const groups = {};
    KEY_ACTIONS.forEach(a => { (groups[a.group] = groups[a.group] || []).push(a); });
    let html = '<div class="fmt-note">' + svgIcon('keyboard') +
      '<span>点右侧键位即可重新绑定：直接按下想用的组合键（按 Esc 取消）。与其他动作冲突时会标红并询问是否替换。在输入框里打字时这些快捷键不会触发；Esc 与保存键（Ctrl+S）在输入状态下仍然可用。</span></div>';
    Object.keys(groups).forEach(g => {
      html += '<div class="set-group">' + esc(g) + '</div>';
      groups[g].forEach(a => {
        const k = SETTINGS.keys[a.id] || '';
        const conflict = !!k && Object.keys(SETTINGS.keys).some(id => id !== a.id && SETTINGS.keys[id] === k);
        const rec = UI.capture === a.id;
        html += '<div class="key-row">' +
          '<span class="kr-l">' + esc(a.label) +
            (a.def ? '<span class="kr-g">默认 ' + esc(prettyKey(a.def)) + '</span>' : '') +
          '</span>' +
          '<button class="key-btn' + (rec ? ' rec' : '') + (conflict ? ' conflict' : '') +
            '" data-act="bind-key" data-id="' + a.id + '">' +
            (rec ? '按下新组合键…' : esc(k ? prettyKey(k) : '未绑定')) +
          '</button>' +
        '</div>';
      });
    });
    bd.innerHTML = html;
    ft.innerHTML =
      '<button class="btn" data-act="key-reset">' + svgIcon('reset') + '恢复默认键位</button>' +
      '<span class="top-sp" style="flex:1"></span>' +
      '<span class="hint" style="align-self:center">共 ' + KEY_ACTIONS.length + ' 个动作可绑定</span>';
    return;
  }

  /* 鼠标与修饰键 */
  let html = '<div class="fmt-note">' + svgIcon('mouse') +
    '<span>只影响操作手感，不影响数据。修饰键选「不启用」即关闭该行为。触屏设备上长按节点或空白处等同于右键。</span></div>';
  html += '<div class="set-group">拖拽行为</div>';
  MOUSE_SELECTS.forEach(o => {
    html += '<div class="set-row"><div class="sr-l">' +
      '<div class="sr-t">' + esc(o.label) + '</div>' +
      '<div class="sr-h">' + esc(o.hint || '') + '</div></div>' +
      '<select data-act="set-mouse" data-id="' + o.id + '">' +
        o.choices.map(c => '<option value="' + c[0] + '"' +
          (mouseOf(o.id) === c[0] ? ' selected' : '') + '>' + esc(c[1]) + '</option>').join('') +
      '</select></div>';
  });
  html += '<div class="set-group">开关</div>';
  MOUSE_TOGGLES.forEach(o => {
    html += '<div class="set-row"><div class="sr-l">' +
      '<div class="sr-t">' + esc(o.label) + '</div>' +
      '<div class="sr-h">' + esc(o.hint || '') + '</div></div>' +
      '<label class="switch" style="padding:0"><input type="checkbox" data-act="toggle-mouse" data-id="' + o.id + '"' +
        (mouseOn(o.id) ? ' checked' : '') + '><span class="sw"></span></label>' +
    '</div>';
  });
  bd.innerHTML = html;
  ft.innerHTML =
    '<button class="btn" data-act="mouse-reset">' + svgIcon('reset') + '全部恢复默认</button>' +
    '<span class="top-sp" style="flex:1"></span>' +
    '<span class="hint" style="align-self:center">改动即时生效并保存</span>';
}

function onSettingsChange(e){
  const el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  const act = el.getAttribute('data-act');
  const id = el.getAttribute('data-id');
  if (act === 'set-mouse'){
    SETTINGS.mouse[id] = el.value;
    saveSettings();
    toast('已更新：' + el.options[el.selectedIndex].text);
    return;
  }
  if (act === 'toggle-mouse'){
    SETTINGS.mouse[id] = !!el.checked;
    saveSettings();
    toast(el.checked ? '已开启' : '已关闭');
  }
}
function onSettingsClick(e){
  const el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  const act = el.getAttribute('data-act');
  if (act === 'bind-key'){
    UI.capture = el.getAttribute('data-id');
    refreshAll();
    return;
  }
  if (act === 'key-reset'){
    if (!confirm('把所有快捷键恢复为默认键位？')) return;
    KEY_ACTIONS.forEach(a => { SETTINGS.keys[a.id] = a.def; });
    saveSettings();
    refreshAll();
    toast('快捷键已恢复默认');
    return;
  }
  if (act === 'mouse-reset'){
    MOUSE_SELECTS.forEach(o => { SETTINGS.mouse[o.id] = o.def; });
    MOUSE_TOGGLES.forEach(o => { SETTINGS.mouse[o.id] = o.def; });
    saveSettings();
    refreshAll();
    toast('鼠标设置已恢复默认');
    return;
  }
}

/* ---------- 事件委托：data-act 分发 ---------- */
function dupWorkflow(id){
  const src = getWf(id);
  if (!src) return;
  const cp = clone(src);
  cp.id = uid('wf');
  cp.name = src.name + ' 副本';
  cp.createdAt = nowISO();
  cp.updatedAt = nowISO();
  const m = {};
  cp.nodes.forEach(n => { const o = n.id; n.id = uid('n'); m[o] = n.id; });
  cp.edges = cp.edges.map(ed => ({ id:uid('e'), from:m[ed.from] || ed.from, to:m[ed.to] || ed.to, label:ed.label || '' }));
  DB.workflows.push(cp);
  DB.activeWfId = cp.id;
  setSel([]);
  saveData(true); commit('dup-wf'); refreshAll();
  toast('已复制工作流');
}
function delWorkflow(id){
  const w = getWf(id);
  if (!w) return;
  if (DB.workflows.length <= 1){ toast('至少保留一个工作流','warn'); return; }
  if (!confirm('删除《' + w.name + '》？该操作不可撤销。')) return;
  DB.workflows = DB.workflows.filter(x => x.id !== id);
  if (DB.activeWfId === id) DB.activeWfId = DB.workflows[0].id;
  setSel([]);
  saveData(true); commit('del-wf'); refreshAll();
  toast('已删除工作流');
}

function runCtxAction(act, arg){
  const wf = getActiveWf();
  if (!wf) return;
  if (act === 'ctx-add'){
    const p = UI.ctxPos || { x:140, y:60 };
    const n = addNodeAt(arg, p.x - NODE_W / 2, p.y - 42);
    if (n) scrollToNode(n.id);
    return;
  }
  if (act === 'ctx-layout'){ autoLayout(); return; }
  if (act === 'ctx-fit'){ fitView(); return; }
  if (act === 'ctx-select-all'){
    if (!wf.nodes.length) return;
    setSel(wf.nodes.map(n => n.id));
    refreshAll();
    toast('已选中全部 ' + wf.nodes.length + ' 个节点');
    return;
  }
  if (act === 'ctx-dup'){ dupSelected(); return; }
  if (act === 'ctx-add-next'){ addNextAfter(primaryId()); return; }
  if (act === 'ctx-human'){ toggleHumanOnSelected(); return; }
  if (act === 'ctx-align'){ alignSelected(arg); return; }
  if (act === 'ctx-unlink'){
    const ids = selIds();
    if (!ids.length) return;
    const cnt = wf.edges.filter(e => ids.indexOf(e.from) >= 0 || ids.indexOf(e.to) >= 0).length;
    if (!cnt){ toast('这些节点没有连线','warn'); return; }
    if (!confirm('断开与选中节点相关的 ' + cnt + ' 条连线？')) return;
    wf.edges = wf.edges.filter(e => ids.indexOf(e.from) < 0 && ids.indexOf(e.to) < 0);
    touchWf(wf); saveData(true); commit('unlink'); refreshAll();
    toast('已断开 ' + cnt + ' 条连线');
    return;
  }
  if (act === 'ctx-del'){ delSelected(); return; }
  if (act === 'ctx-rename'){ startRenameNode(primaryId()); return; }
  if (act === 'ctx-rename-wf'){ startRenameWf(arg); return; }
  if (act === 'ctx-dup-wf'){ dupWorkflow(arg); return; }
  if (act === 'ctx-del-wf'){ delWorkflow(arg); return; }
  if (act === 'ctx-edge-label'){
    const ed = wf.edges.find(x => x.id === arg);
    if (!ed) return;
    const v = prompt('给这条连线加个标签（留空即清除）：', ed.label || '');
    if (v === null) return;
    ed.label = String(v).trim();
    touchWf(wf); saveData(true); commit('edge-label'); refreshAll();
    return;
  }
  if (act === 'ctx-edge-del'){ removeEdgeById(arg); return; }
}

function removeEdgeById(id){
  const wf = getActiveWf();
  if (!wf || !wf.edges.some(x => x.id === id)) return;
  wf.edges = wf.edges.filter(x => x.id !== id);
  UI.selEdge = null;
  touchWf(wf); saveData(true); commit('unlink'); refreshAll();
  toast('已删除连线');
}

function onDocClick(e){
  const cxEl = e.target && e.target.closest ? e.target.closest('[data-cx]') : null;
  if (cxEl){
    const cAct = cxEl.getAttribute('data-cx');
    const cArg = cxEl.getAttribute('data-arg');
    closeCtxMenu();
    runCtxAction(cAct, cArg);
    return;
  }
  if (UI.ctxOpen){
    const inside = e.target && e.target.closest && e.target.closest('#ctxMenu');
    if (!inside){ closeCtxMenu(); }
  }

  /* 点连线 = 选中（Delete 键删除；双击 / 右键可快速删除） */
  const eg = e.target && e.target.closest ? e.target.closest('.edge-g') : null;
  if (eg){
    const eid = eg.getAttribute('data-edge-id');
    UI.selEdge = (UI.selEdge === eid) ? null : eid;
    if (UI.selEdge) setSel([]);
    refreshAll();
    return;
  }

  const el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  const act = el.getAttribute('data-act');
  const id = el.getAttribute('data-id');
  const wf = getActiveWf();

  if (act === 'sel-wf'){
    if (DB.activeWfId !== id){
      DB.activeWfId = id;
      DB.ui.selectedIds = [];
      saveData(true); refreshAll();
    }
    document.body.classList.remove('pane-l');
    return;
  }
  if (act === 'rename-wf'){ startRenameWf(id); return; }
  if (act === 'dup-wf'){ dupWorkflow(id); return; }
  if (act === 'del-wf'){ delWorkflow(id); return; }
  if (act === 'todo-do'){
    const kind = el.getAttribute('data-do');
    const wfId = el.getAttribute('data-wf');
    const nodeId = el.getAttribute('data-node');
    if (wfId) DB.activeWfId = wfId;
    if (kind === 'confirm' && nodeId){
      const found = nodeById(nodeId);
      if (found){ found.node.checked = true; touchWf(found.wf); saveData(true); refreshAll(); toast('已标记为该卡点确认通过'); }
      return;
    }
    if (kind === 'add'){
      DB.ui.selectedIds = []; saveData(true); refreshAll(); addNode('start');
      return;
    }
    if (kind === 'fix'){
      setSel(nodeId);
      saveData(true);
      openExport('check');
      return;
    }
    setSel(nodeId);
    DB.ui.view = 'canvas';
    saveData(true); refreshAll();
    if (nodeId) scrollToNode(nodeId);
    return;
  }
  if (act === 'sel-node'){ selectNode(id); return; }
  if (act === 'add-node'){ addNode('llm'); return; }
  if (act === 'seed-flow'){ seedFlow(); return; }
  if (act === 'add-next'){ addNextAfter(id); return; }
  if (act === 'dup-node'){ dupSelected(); return; }
  if (act === 'del-node'){ delSelected(); return; }
  if (act === 'ctx-human'){ toggleHumanOnSelected(); return; }
  if (act === 'ctx-unlink'){ runCtxAction('ctx-unlink'); return; }
  if (act === 'align'){ alignSelected(id); return; }
  if (act === 'clear-field'){
    const cwf = getActiveWf();
    const f = id;
    if (!cwf || !f) return;
    const nd = selIds().length === 1 ? getNode(cwf, primaryId()) : null;
    if (nd && Object.prototype.hasOwnProperty.call(nd, f)) nd[f] = '';
    else if (Object.prototype.hasOwnProperty.call(cwf, f)) cwf[f] = '';
    else return;
    touchWf(cwf); saveData(true); commit('clear-field'); refreshAll();
    return;
  }
  if (act === 'set-type'){ setNodeType(el.getAttribute('data-type')); return; }
  if (act === 'auto-layout'){ autoLayout(); return; }
  if (act === 'goto-node'){ locateNode(id); return; }
  if (act === 'tab'){ openExport(el.getAttribute('data-tab')); return; }
  if (act === 'copy-json'){
    const w = getWf(id); if (!w) return;
    copyText(JSON.stringify(buildWorkflowFile(w), null, 2), 'JSON 已复制，可直接粘给其他 Agent');
    return;
  }
  if (act === 'dl-json'){
    const w = getWf(id); if (!w) return;
    downloadText(safeFileName(w.name) + '.workflow.json', JSON.stringify(buildWorkflowFile(w), null, 2), 'application/json');
    toast('已下载工作流文件');
    return;
  }
  if (act === 'copy-md'){
    const w = getWf(id); if (!w) return;
    copyText(buildHandoff(w), '交接包已复制，可直接发给另一个 Agent');
    return;
  }
  if (act === 'dl-md'){
    const w = getWf(id); if (!w) return;
    downloadText(safeFileName(w.name) + '-交接包.md', buildHandoff(w), 'text/markdown');
    toast('已下载交接包');
    return;
  }
  if (act === 'do-import'){
    const ta = document.getElementById('importTa');
    doImport(ta ? ta.value : '');
    return;
  }
  if (act === 'pick-file'){
    const f = document.getElementById('importFile');
    if (f) f.click();
    return;
  }
  if (act === 'reset-demo'){
    if (!confirm('恢复示例数据：会清空当前全部工作流并重新预置示例，确定继续？')) return;
    DB = seedData();
    saveData(true); closeExport(); refreshAll();
    toast('已恢复示例数据');
    return;
  }
}

/* ---------- 属性面板输入 ---------- */
function onInspInput(e){
  if (e.type === 'change' && e.target.type !== 'checkbox') return;
  const wf = getActiveWf();
  if (!wf) return;
  const fEl = e.target.closest('[data-f]');
  if (fEl){
    const n = getNode(wf, primaryId());
    if (!n) return;
    const f = fEl.getAttribute('data-f');
    let v;
    if (fEl.type === 'checkbox') v = fEl.checked;
    else if (fEl.type === 'number') v = Math.max(0, parseInt(fEl.value || '0', 10) || 0);
    else v = fEl.value;
    if (n[f] === v) return;
    n[f] = v;
    if (f === 'checked' && v) n.humanCheck = true;
    touchWf(wf);
    if (fEl.type === 'checkbox'){
      saveData();
      commit('field:' + f);
      refreshAll();
    } else {
      updateCountHint(fEl);
      autoGrowEl(fEl);
      queueRefresh('field:' + f);
    }
    return;
  }
  const wEl = e.target.closest('[data-wf]');
  if (wEl){
    const f = wEl.getAttribute('data-wf');
    if (wf[f] === wEl.value) return;
    wf[f] = wEl.value;
    touchWf(wf);
    updateCountHint(wEl);
    autoGrowEl(wEl);
    queueRefresh('wfield:' + f);
  }
}

/* ---------- 画布：拖动 / 连线 ---------- */
function stagePoint(clientX, clientY){
  const stage = document.getElementById('canvasStage');
  if (!stage) return { x:0, y:0 };
  const r = stage.getBoundingClientRect();
  const z = DB.ui.zoom || 1;
  return { x:(clientX - r.left) / z, y:(clientY - r.top) / z };
}

let EDGE_RAF = null;
function scheduleEdgeRedraw(){
  if (EDGE_RAF) return;
  EDGE_RAF = requestAnimationFrame(() => {
    EDGE_RAF = null;
    const wf = getActiveWf();
    const st = document.getElementById('canvasStage');
    if (wf && st) drawEdgePaths(wf, st);
  });
}

function drawTempLink(clientX, clientY){
  const g = document.getElementById('edgeG');
  const st = document.getElementById('canvasStage');
  if (!g || !st || !UI.linking) return;
  let p = document.getElementById('tempEdge');
  if (!p){
    p = document.createElementNS(SVG_NS, 'path');
    p.setAttribute('id', 'tempEdge');
    p.setAttribute('class', 'edge temp');
    g.appendChild(p);
  }
  const wf = getActiveWf();
  const n = getNode(wf, UI.linking.from);
  const el = st.querySelector('.node[data-node-id="' + UI.linking.from + '"]');
  if (!n || !el) return;
  const pt = stagePoint(clientX, clientY);
  const x1 = n.x + el.offsetWidth / 2, y1 = n.y + el.offsetHeight;
  const dy = Math.max(38, Math.abs(pt.y - y1) * 0.45);
  p.setAttribute('d', 'M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + (y1 + dy) + ', ' + pt.x + ' ' + (pt.y - dy) + ', ' + pt.x + ' ' + pt.y);
}

/* 修饰键判定：配置里存的是 'shift' / 'ctrl' / 'alt' / 'none' */
function modOf(id){ return mouseOf(id) || 'none'; }
function modActive(mod, e){
  if (mod === 'shift') return !!e.shiftKey;
  if (mod === 'ctrl')  return !!(e.ctrlKey || e.metaKey);
  if (mod === 'alt')   return !!e.altKey;
  if (mod === 'space') return SPACE_DOWN;
  return false;
}
function modLabel(mod){
  return { shift:'Shift', ctrl:'Ctrl', alt:'Alt', space:'空格', middle:'中键', none:'不启用' }[mod] || mod;
}
function suppressBlank(ms){
  UI.suppressBlank = true;
  setTimeout(() => { UI.suppressBlank = false; }, ms || 90);
}

let LONGPRESS = null;
/* 空格手型平移：按住期间可在任意位置平移画布（keyup / 失焦复位） */
let SPACE_DOWN = false;
function setSpacePan(on){
  SPACE_DOWN = !!on;
  if (!UI.pan && !UI.drag) document.body.style.cursor = on ? 'grab' : '';
}
function onKeyUp(e){ if (e.code === 'Space' || e.key === ' ') setSpacePan(false); }
function resetSpacePan(){ setSpacePan(false); }
function clearLongPress(){ if (LONGPRESS){ clearTimeout(LONGPRESS); LONGPRESS = null; } }

function hintFade(){
  const hintEl = document.getElementById('canvasHint');
  if (hintEl && !hintEl.classList.contains('fade')) hintEl.classList.add('fade');
}

function onCanvasDown(e){
  if (DB.ui.view !== 'canvas') return;
  const scroll = document.getElementById('canvasScroll');
  if (!scroll) return;
  /* 点在滚动条上则忽略 */
  const sr = scroll.getBoundingClientRect();
  if (e.clientX - sr.left > scroll.clientWidth || e.clientY - sr.top > scroll.clientHeight) return;
  const wf = getActiveWf();
  if (!wf) return;

  hintFade();
  UI.pressX = e.clientX;
  UI.pressY = e.clientY;
  const nodeEl = e.target.closest ? e.target.closest('.node') : null;
  const portEl = e.target.closest ? e.target.closest('.port.out') : null;

  /* 移动端长按 = 右键菜单 */
  clearLongPress();
  if (e.pointerType === 'touch' && mouseOn('rightMenu')){
    const tx = e.clientX, ty = e.clientY, tNode = nodeEl;
    LONGPRESS = setTimeout(() => {
      LONGPRESS = null;
      UI.drag = null; UI.boxSel = null; UI.pan = null;
      const br = document.getElementById('boxRect'); if (br) br.classList.remove('on');
      document.body.style.cursor = '';
      if (tNode){
        const nid = tNode.getAttribute('data-node-id');
        if (!isSel(nid)){ setSel(nid); refreshAll(); }
        openCtxMenu(tx, ty, buildNodeMenu(nid));
      } else {
        UI.ctxPos = stagePoint(tx, ty);
        openCtxMenu(tx, ty, buildCanvasMenu(UI.ctxPos));
      }
      try { if (navigator.vibrate) navigator.vibrate(12); } catch(err){}
    }, 520);
  }

  /* 0) 手型平移优先：空格 / 配置的修饰键 / 鼠标中键在任意位置（含节点与端口上）都能平移 */
  const panModEarly = modOf('panMod');
  if (e.button === 1 || (panModEarly !== 'none' && modActive(panModEarly, e))){
    clearLongPress();
    e.preventDefault();
    UI.pan = { sx:e.clientX, sy:e.clientY, sl:scroll.scrollLeft, st:scroll.scrollTop };
    document.body.style.cursor = 'grabbing';
    try { scroll.setPointerCapture(e.pointerId); } catch(err){}
    return;
  }
  /* 1) 从输出端口拖出连线 */
  if (nodeEl && portEl){
    clearLongPress();
    e.preventDefault();
    const nodeId = nodeEl.getAttribute('data-node-id');
    UI.linking = { from:nodeId };
    document.querySelectorAll('.node').forEach(nd => { if (nd !== nodeEl) nd.classList.add('link-ok'); });
    document.body.classList.add('linking');
    drawTempLink(e.clientX, e.clientY);
    try { scroll.setPointerCapture(e.pointerId); } catch(err){}
    return;
  }

  /* 2) 拖动节点（可多选整组拖动；按住复制修饰键则先复制） */
  if (nodeEl){
    clearLongPress();
    e.preventDefault();
    const id = nodeEl.getAttribute('data-node-id');
    const additive = e.shiftKey || e.ctrlKey || e.metaKey;
    if (additive){
      selectNode(id, true);
    } else if (!isSel(id)){
      setSel(id);
      refreshAll();
    }
    const dupMod = modOf('dupDragMod');
    let isDup = false;
    if (dupMod !== 'none' && modActive(dupMod, e) && !additive){
      isDup = true;
      dupNodes(selIds());
    }
    const list = selNodes();
    if (!list.length) return;
    UI.drag = {
      ids:list.map(n => n.id),
      origins:list.map(n => ({ id:n.id, x:n.x, y:n.y })),
      sx:e.clientX, sy:e.clientY,
      moved:false,
      axis:(modOf('axisDragMod') !== 'none' && modActive(modOf('axisDragMod'), e)) ? 1 : 0,
      z:(DB.ui.zoom || 1),
      dup:isDup
    };
    document.body.style.cursor = 'grabbing';
    document.querySelectorAll('.node.on').forEach(nd => { nd.style.zIndex = '5'; });
    try { scroll.setPointerCapture(e.pointerId); } catch(err){}
    return;
  }

  /* 3) 空白处：平移 或 框选 */
  const panMod = modOf('panMod');
  const wantPan = e.button === 1 ||
                  (mouseOn('rightMenu') && panMod === 'middle' && e.button === 1) ||
                  (panMod !== 'none' && modActive(panMod, e)) ||
                  (mouseOf('emptyDrag') === 'pan' && !e.shiftKey && e.button === 0);
  e.preventDefault();
  if (wantPan){
    clearLongPress();
    UI.pan = { sx:e.clientX, sy:e.clientY, sl:scroll.scrollLeft, st:scroll.scrollTop };
    document.body.style.cursor = 'grabbing';
    if (selIds().length && !e.shiftKey){ setSel([]); refreshAll(); }
    try { scroll.setPointerCapture(e.pointerId); } catch(err){}
    return;
  }
  UI.boxSel = { sx:e.clientX, sy:e.clientY, cx:e.clientX, cy:e.clientY, add:!!(e.shiftKey || e.ctrlKey || e.metaKey) };
  const rect = document.getElementById('boxRect');
  if (rect){
    rect.classList.add('on');
    rect.style.left = e.clientX + 'px';
    rect.style.top = e.clientY + 'px';
    rect.style.width = '0px';
    rect.style.height = '0px';
  }
  if (!UI.boxSel.add && selIds().length){ setSel([]); refreshAll(); }
  try { scroll.setPointerCapture(e.pointerId); } catch(err){}
}

/* 框选命中判定 */
function selectInRect(b){
  const wf = getActiveWf();
  const stage = document.getElementById('canvasStage');
  if (!wf || !stage) return;
  const sr = stage.getBoundingClientRect();
  const z = DB.ui.zoom || 1;
  const x1 = (Math.min(b.sx, b.cx) - sr.left) / z;
  const y1 = (Math.min(b.sy, b.cy) - sr.top) / z;
  const x2 = (Math.max(b.sx, b.cx) - sr.left) / z;
  const y2 = (Math.max(b.sy, b.cy) - sr.top) / z;
  const hits = [];
  wf.nodes.forEach(n => {
    const el = stage.querySelector('.node[data-node-id="' + n.id + '"]');
    const w = el ? el.offsetWidth : NODE_W, h = el ? el.offsetHeight : 96;
    if (n.x < x2 && n.x + w > x1 && n.y < y2 && n.y + h > y1) hits.push(n.id);
  });
  if (b.add){
    hits.forEach(id => { if (!isSel(id)) addSel(id); });
    refreshAll();
  } else {
    setSel(hits);
    refreshAll();
  }
  if (hits.length) toast('已选中 ' + selIds().length + ' 个节点');
  else if (!b.add) toast('没有框中节点','warn');
}

/* =========================================================================
   右键菜单
   ========================================================================= */
function openCtxMenu(x, y, items){
  const el = document.getElementById('ctxMenu');
  if (!el || !items || !items.length) return;
  el.innerHTML = items.map(it => {
    if (it.sep) return '<div class="ctx-sep"></div>';
    if (it.title) return '<div class="ctx-title">' + esc(it.title) + '</div>';
    const dot = it.dot
      ? '<span style="width:9px;height:9px;border-radius:3px;background:' + it.dot + ';flex:none"></span>'
      : '';
    const ic = it.icon ? '<span class="ico">' + svgIcon(it.icon) + '</span>' : '';
    return '<div class="ctx-item' + (it.danger ? ' danger' : '') + (it.disabled ? ' disabled' : '') + '"' +
      ' data-cx="' + esc(it.act || '') + '"' + (it.arg != null ? ' data-arg="' + esc(String(it.arg)) + '"' : '') + '>' +
      (dot || ic) + '<span>' + esc(it.label) + '</span>' +
      (it.kbd ? '<span class="kbd">' + esc(it.kbd) + '</span>' : '') +
    '</div>';
  }).join('');
  el.classList.add('on');
  const r = el.getBoundingClientRect();
  let left = x, top = y;
  if (left + r.width > window.innerWidth - 8) left = Math.max(8, window.innerWidth - r.width - 8);
  if (top + r.height > window.innerHeight - 8) top = Math.max(8, window.innerHeight - r.height - 8);
  el.style.left = Math.round(left) + 'px';
  el.style.top = Math.round(top) + 'px';
  UI.ctxOpen = true;
}
function closeCtxMenu(){
  const el = document.getElementById('ctxMenu');
  if (el) el.classList.remove('on');
  UI.ctxOpen = false;
}

function onWheel(e){
  if (DB.ui.view !== 'canvas' || UI.editing) return;
  const scroll = document.getElementById('canvasScroll');
  if (!scroll || !scroll.contains(e.target)) return;
  const zm = modOf('wheelZoomMod');
  if (zm !== 'none' && modActive(zm, e)){
    e.preventDefault();
    zoomStep(e.deltaY < 0 ? 0.1 : -0.1, { cx:e.clientX, cy:e.clientY });

  if (mouseOn('shiftWheelX') && e.shiftKey && !e.ctrlKey){

function onDocMove(e){
  if (LONGPRESS && (Math.abs(e.clientX - (UI.pressX || 0)) > 6 || Math.abs(e.clientY - (UI.pressY || 0)) > 6)) clearLongPress();

  if (UI.drag){
    const d = UI.drag;
    const wf = getActiveWf();
    if (!wf) return;
    let dx = (e.clientX - d.sx) / d.z;
    let dy = (e.clientY - d.sy) / d.z;
    if (Math.abs(e.clientX - d.sx) > 3 || Math.abs(e.clientY - d.sy) > 3) d.moved = true;
    if (d.axis){
      if (Math.abs(dx) >= Math.abs(dy)) dy = 0; else dx = 0;
    }
    d.origins.forEach(o => {
      const n = getNode(wf, o.id);
      if (!n) return;
      n.x = Math.max(0, Math.round((o.x + dx) / 5) * 5);
      n.y = Math.max(0, Math.round((o.y + dy) / 5) * 5);
      const el = document.querySelector('#canvasStage .node[data-node-id="' + o.id + '"]');
      if (el){ el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; }
    });
    scheduleEdgeRedraw();
    return;
  }
  if (UI.pan){
    const scroll = document.getElementById('canvasScroll');
    if (!scroll) return;
    scroll.scrollLeft = UI.pan.sl - (e.clientX - UI.pan.sx);
    scroll.scrollTop  = UI.pan.st - (e.clientY - UI.pan.sy);
    return;
  }
  if (UI.boxSel){
    UI.boxSel.cx = e.clientX;
    UI.boxSel.cy = e.clientY;
    const r = document.getElementById('boxRect');
    if (r){
      r.style.left = Math.min(UI.boxSel.sx, e.clientX) + 'px';
      r.style.top = Math.min(UI.boxSel.sy, e.clientY) + 'px';
      r.style.width = Math.abs(e.clientX - UI.boxSel.sx) + 'px';
      r.style.height = Math.abs(e.clientY - UI.boxSel.sy) + 'px';
    }
    return;
  }
  if (UI.linking){ drawTempLink(e.clientX, e.clientY); }
}

function onDocUp(e){
  clearLongPress();
  document.body.style.cursor = '';
  if (UI.drag){
    const d = UI.drag;
    UI.drag = null;
    document.querySelectorAll('#canvasStage .node').forEach(nd => { nd.style.zIndex = ''; });
    const wf = getActiveWf();
    if (d.moved){
      touchWf(wf);
      saveData();
      commit(d.dup ? 'dup-drag' : 'move');
      suppressBlank(90);
      refreshAll({ skipInspector:true });
    } else if (!d.dup){
      suppressBlank(90);
      selectNode(d.ids[0]);
    }
    return;
  }
  if (UI.pan){ UI.pan = null; return; }
  if (UI.boxSel){
    const b = UI.boxSel;
    UI.boxSel = null;
    const r = document.getElementById('boxRect');
    if (r) r.classList.remove('on');
    if (Math.abs(b.cx - b.sx) < 4 && Math.abs(b.cy - b.sy) < 4){
      if (!b.add && selIds().length){ setSel([]); refreshAll(); }
      return;
    }
    suppressBlank(90);
    selectInRect(b);
    return;
  }
  if (UI.linking){
    const from = UI.linking.from;
    const p = document.getElementById('tempEdge');
    if (p) p.remove();
    UI.linking = null;
    document.body.classList.remove('linking');
    document.querySelectorAll('.node').forEach(nd => nd.classList.remove('link-ok'));
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const tgt = under && under.closest ? under.closest('.node') : null;
    if (tgt){
      const toId = tgt.getAttribute('data-node-id');
      if (toId && toId !== from) createEdge(from, toId);
    }
  }
}

/* 把键盘事件规范成 'ctrl+shift+z' 这样的字符串，便于与配置比对 */
function evKeyString(e){
  const k0 = String(e.key || '').toLowerCase();
  if (k0 === 'control' || k0 === 'shift' || k0 === 'alt' || k0 === 'meta') return '';
  const parts = [];
  if (e.ctrlKey || e.metaKey) parts.push('ctrl');
  if (e.altKey) parts.push('alt');
  if (e.shiftKey) parts.push('shift');
  let k = k0;
  if (k === ' ') k = 'space';
  if (k === 'esc') k = 'escape';
  if (k === 'del') k = 'delete';
  if (k === 'arrowup') k = 'up';
  if (k === 'arrowdown') k = 'down';
  if (k === 'arrowleft') k = 'left';
  if (k === 'arrowright') k = 'right';
  parts.push(k);
  return parts.join('+');
}
function findActionByKey(str){
  if (!str) return null;
  const ids = Object.keys(SETTINGS.keys);
  for (let i = 0; i < ids.length; i++){
    if (SETTINGS.keys[ids[i]] === str) return ids[i];
  }
  return null;
}
function isTypingTarget(t){
  if (!t) return false;
  const tag = (t.tagName || '').toLowerCase();
  return tag === 'input' || tag === 'textarea' || tag === 'select' || t.isContentEditable;
}
/* Tab 在属性面板字段间跳转（textarea 默认会插入制表符，这里接过来用） */
function handleTabJump(e){
  const box = document.getElementById('inspBd');
  if (!box) return;
  const fields = Array.prototype.slice.call(box.querySelectorAll('input,textarea,select'))
    .filter(el => !el.disabled && el.offsetParent !== null);
  if (!fields.length) return;
  e.preventDefault();
  const i = fields.indexOf(e.target);
  let next = fields[(i + (e.shiftKey ? -1 : 1) + fields.length) % fields.length];
  if (!next) next = fields[0];
  if (next){
    next.focus();
    try { if (next.select && next.type !== 'checkbox') next.select(); } catch(err){}
  }
}

function labelOfAction(id){
  const a = KEY_ACTIONS.filter(x => x.id === id)[0];
  return a ? a.label : id;
}

function onKey(e){
  /* 正在录制快捷键：把这一次按键绑定上去 */
  if (UI.capture){
    e.preventDefault();
    e.stopPropagation();
    const target = UI.capture;
    if (e.key === 'Escape'){ UI.capture = null; refreshAll(); return; }
    const str = evKeyString(e);
    if (!str) return;                                  // 只按了修饰键，继续等
    UI.capture = null;
    const owner = Object.keys(SETTINGS.keys).filter(id => id !== target && SETTINGS.keys[id] === str)[0];
    if (owner){
      if (!confirm('「' + prettyKey(str) + '」已经被「' + labelOfAction(owner) + '」占用。\n要用它替换吗？原动作将变为未绑定。')){
        refreshAll();
        return;
      }
      SETTINGS.keys[owner] = '';
    }
    SETTINGS.keys[target] = str;
    saveSettings();
    refreshAll();
    toast('已绑定为 ' + prettyKey(str));
    return;
  }
  /* 空格 = 按住即手型平移（录制快捷键与输入状态下不接管） */
  if ((e.code === 'Space' || e.key === ' ') && !isTypingTarget(e.target)){
    setSpacePan(true);
    e.preventDefault();
    return;
  }
  if (UI.editing) return;                              // 就地改名浮层自己处理

  const typing = isTypingTarget(e.target);
  const str = evKeyString(e);
  const closeKey = keyOf('closePanel');

  /* 输入状态：只保留「取消」「保存」「Tab 跳字段」三类 */
  if (typing){
    if (str && str === closeKey){ e.target.blur(); closeTopPanel(); return; }
    if (str && str === keyOf('save')){ e.preventDefault(); saveData(true); toast('已保存到本机'); return; }
    if (e.key === 'Tab'){ handleTabJump(e); return; }
    return;
  }

  /* Esc：逐层关闭（右键菜单 → 设置 → 导出 → 抽屉 → 清空选中） */
  if (str && str === closeKey){ e.preventDefault(); closeTopPanel(); return; }

  /* 面板打开时屏蔽其他快捷键，避免误操作 */
  if (UI.settingsOpen || UI.exportOpen) return;

  /* 方向键微调节点位置（Shift 加速） */
  if (!e.ctrlKey && !e.metaKey && !e.altKey && selIds().length &&
      (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
    e.preventDefault();
    const step = e.shiftKey ? 20 : 5;
    const dx = e.key === 'ArrowLeft' ? -step : (e.key === 'ArrowRight' ? step : 0);
    const dy = e.key === 'ArrowUp' ? -step : (e.key === 'ArrowDown' ? step : 0);
    const wf = getActiveWf();
    selNodes().forEach(n => {
      n.x = Math.max(0, n.x + dx);
      n.y = Math.max(0, n.y + dy);
    });
    if (wf) touchWf(wf);
    saveData();
    commit('nudge', true);
    refreshAll({ skipInspector:true });
    return;
  }

  /* Delete / Backspace：优先删选中的连线，其次删选中节点 */
  if (e.key === 'Delete' || e.key === 'Backspace'){
    if (UI.selEdge){ e.preventDefault(); removeEdgeById(UI.selEdge); return; }
    if (selIds().length){ e.preventDefault(); delSelected(); return; }
  }

  const actId = findActionByKey(str);
  if (actId){ e.preventDefault(); runAction(actId); }
}

/* =========================================================================
   就地改名浮层（节点与工作流共用）
   UI.editing = { kind:'node'|'wf', id }
   ========================================================================= */
function isEditing(kind, id){
  return !!(UI.editing && UI.editing.kind === kind && UI.editing.id === id);
}

function beginRename(kind, id, anchorEl, initial){
  const ed = document.getElementById('inlineEditor');
  if (!ed || !anchorEl) return;
  const r = anchorEl.getBoundingClientRect();
  const w = Math.max(150, Math.min(320, Math.round(r.width) + 34));
  UI.editing = { kind:kind, id:id };
  ed.value = initial || '';
  ed.style.display = 'block';
  ed.style.width = w + 'px';
  ed.style.left = Math.round(Math.max(8, Math.min(r.left - 4, window.innerWidth - w - 8))) + 'px';
  ed.style.top = Math.round(Math.max(6, r.top - 3)) + 'px';
  refreshAll();                                   // 先让被编辑项隐藏原标题，避免重影
  setTimeout(() => { try { ed.focus(); ed.select(); } catch(e){} }, 0);
}

function startRenameNode(nodeId){
  const wf = getActiveWf();
  const n = getNode(wf, nodeId);
  if (!n) return;
  const el = document.querySelector('#canvasStage .node[data-node-id="' + nodeId + '"] .n-t') ||
             document.querySelector('#listView .seq-item[data-id="' + nodeId + '"] .si-t');
  if (!el) return;
  beginRename('node', nodeId, el, n.title);
}
function startRenameWf(wfId){
  const w = getWf(wfId);
  if (!w) return;
  const el = document.querySelector('#wfList .wf-item[data-id="' + wfId + '"] .wf-name');
  if (!el) return;
  beginRename('wf', wfId, el, w.name);
}

function commitInlineRename(){
  const ed = document.getElementById('inlineEditor');
  const edt = UI.editing;
  if (!ed || !edt) return;
  UI.editing = null;
  ed.style.display = 'none';
  const v = String(ed.value || '').trim();
  if (v){
    if (edt.kind === 'node'){
      const wf = getActiveWf();
      const n = getNode(wf, edt.id);
      if (n && v !== n.title){
        n.title = v;
        touchWf(wf);
        saveData(true);
        commit('rename-node');
      } else if (n && !n.title){
        n.title = v; touchWf(wf); saveData(true); commit('rename-node');
      }
    } else {
      const w = getWf(edt.id);
      if (w && v !== w.name){
        w.name = v;
        touchWf(w);
        saveData(true);
        commit('rename-wf');
      }
    }
  }
  refreshAll();
}
function cancelInlineRename(){
  const ed = document.getElementById('inlineEditor');
  UI.editing = null;
  if (ed) ed.style.display = 'none';
  refreshAll();
}

/* 重命名入口：有选中节点就改节点，否则改当前工作流 */
function renamePrimary(){
  if (selIds().length >= 1){ startRenameNode(primaryId()); return; }
  const wf = getActiveWf();
  if (wf) startRenameWf(wf.id);
}

function bindEvents(){
  document.addEventListener('click', onDocClick);
  document.addEventListener('keydown', onKey);
  document.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', resetSpacePan);
  document.addEventListener('pointermove', onDocMove, { passive:true });
  document.addEventListener('pointerup', onDocUp);
  document.addEventListener('pointercancel', onDocUp);

  const inspBd = document.getElementById('inspBd');
  if (inspBd){
    inspBd.addEventListener('input', onInspInput);
    inspBd.addEventListener('change', onInspInput);
    inspBd.addEventListener('paste', onInspPaste);
  }

  /* 画布：指针交互统一挂在滚动容器上，空白区域也能收到事件 */
  const scroll = document.getElementById('canvasScroll');
  if (scroll){
    scroll.addEventListener('pointerdown', onCanvasDown);
    scroll.addEventListener('contextmenu', onContextMenu);
    scroll.addEventListener('dblclick', onDblClick);
    scroll.addEventListener('wheel', onWheel, { passive:false });
    scroll.addEventListener('click', (e) => {
      if (UI.suppressBlank || UI.ctxOpen) return;
      const t = e.target;
      if (t.closest && (t.closest('.node') || t.closest('.edge-g'))) return;
      if (selIds().length || UI.selEdge){ setSel([]); UI.selEdge = null; refreshAll(); }
    });
  }
  document.addEventListener('auxclick', (e) => { if (e.button === 1) e.preventDefault(); });

  /* 工作流库：双击改名 + 右键菜单 */
  const wfList = document.getElementById('wfList');
  if (wfList){
    wfList.addEventListener('dblclick', onWfListDblClick);
    wfList.addEventListener('contextmenu', onWfListContextMenu);
  }
  /* 清单视图：双击改名 + 右键菜单 */
  const listView = document.getElementById('listView');
  if (listView){
    listView.addEventListener('dblclick', onListDblClick);
    listView.addEventListener('contextmenu', onListContextMenu);
  }

  /* 操作设置面板（容器常驻，内部内容会被重渲染） */
  const setBd = document.getElementById('setBd');
  if (setBd){
    setBd.addEventListener('change', onSettingsChange);
    setBd.addEventListener('click', onSettingsClick);
  }

  /* 就地改名浮层 */
  const inlineEd = document.getElementById('inlineEditor');
  if (inlineEd){
    inlineEd.addEventListener('pointerdown', (e) => e.stopPropagation());
    inlineEd.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter'){ e.preventDefault(); commitInlineRename(); }
      else if (e.key === 'Escape'){ e.preventDefault(); cancelInlineRename(); }
    });
    inlineEd.addEventListener('blur', () => { if (UI.editing) commitInlineRename(); });
  }

  /* 顶栏 */
  const bind = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  bind('btnExportTop', 'click', () => openExport());
  bind('btnHelp', 'click', showHelp);
  bind('btnHelp2', 'click', showHelp);
  bind('btnExpClose', 'click', closeExport);
  bind('btnSetClose', 'click', closeSettings);
  bind('btnSettings', 'click', () => openSettings());
  bind('btnUndo', 'click', undo);
  bind('btnRedo', 'click', redo);
  bind('btnFit', 'click', fitView);
  bind('mask', 'click', (e) => { if (e.target.id === 'mask') closeTopPanel(); });

  /* 左栏 */
  bind('btnNewWf', 'click', createWorkflow);
  bind('btnExportJson', 'click', () => {
    downloadText('工作流编排台-备份-' + fmtDate(nowISO()) + '.json', JSON.stringify(DB, null, 2), 'application/json');
    toast('已导出全部备份');
  });
  bind('btnImportJson', 'click', () => { openExport('import'); });
  bind('btnClearEx', 'click', () => {
    if (!confirm('清空示例数据：会删除全部工作流，且不可恢复。建议先导出备份。确定继续？')) return;
    const wf = blankWorkflow('我的第一个工作流');
    DB = { schema:'workflow-studio/v1', appVersion:APP_VER, isSeed:false, activeWfId:wf.id, ui:{ view:'canvas', selectedIds:[], zoom:1 }, workflows:[wf] };
    histReset();
    saveData(true); refreshAll();
    toast('已清空，留下一个空白工作流');
  });

  /* 待处理折叠 */
  bind('todoHd', 'click', () => { UI.todoOpen = !UI.todoOpen; refreshAll(); });

  /* 画布工具条 */
  bind('btnAddNode', 'click', () => addNode('llm'));
  bind('btnAuto', 'click', autoLayout);
  bind('zoomIn', 'click', () => zoomBy(0.1));
  bind('zoomOut', 'click', () => zoomBy(-0.1));
  bind('vCanvas', 'click', () => { if (DB.ui.view !== 'canvas'){ DB.ui.view = 'canvas'; saveData(); refreshAll(); } });
  bind('vList', 'click', () => { if (DB.ui.view !== 'list'){ DB.ui.view = 'list'; saveData(); refreshAll(); } });

  /* Tab 切换（导出抽屉） */
  document.querySelectorAll('.tabs button[data-tab]').forEach(b => {
    b.addEventListener('click', () => openExport(b.getAttribute('data-tab')));
  });
  document.querySelectorAll('.tabs button[data-stab]').forEach(b => {
    b.addEventListener('click', () => openSettings(b.getAttribute('data-stab')));
  });

  /* 导入文件 */
  bind('importFile', 'change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { doImport(String(r.result || '')); };
    r.onerror = () => toast('文件读取失败','err');
    r.readAsText(f, 'utf-8');
  });

  /* 移动端导航 */
  bind('openL', 'click', () => togglePane('l'));
  bind('openR', 'click', () => togglePane('r'));
  bind('closeL', 'click', () => document.body.classList.remove('pane-l'));
  bind('closeR', 'click', () => document.body.classList.remove('pane-r'));
  bind('tLib', 'click', () => togglePane('l'));
  bind('tInsp', 'click', () => togglePane('r'));
  bind('tCanvas', 'click', () => { document.body.classList.remove('pane-l','pane-r'); if (DB.ui.view !== 'canvas'){ DB.ui.view='canvas'; saveData(); refreshAll(); } });
  bind('mobView', 'click', toggleViewMode);
  bind('tExp', 'click', () => openExport());

  /* 移动端：点抽屉外的遮罩关闭抽屉（排除触发它的按钮本身） */
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (!t || !t.closest) return;
    if (Date.now() - PANE_GUARD < 420) return;
    if (document.body.classList.contains('pane-l') &&
        !t.closest('#sidebar') && !t.closest('#openL') && !t.closest('#tLib')){
      document.body.classList.remove('pane-l');
    }
    if (document.body.classList.contains('pane-r') &&
        !t.closest('#inspector') && !t.closest('#openR') && !t.closest('#tInsp')){
      document.body.classList.remove('pane-r');
    }
  });

  /* 离开页面 / 切后台时立即落盘，避免落在节流窗口内丢数据 */
  const flush = () => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch(e){}
  };
  window.addEventListener('beforeunload', flush);
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flush();
  });
}

/* =========================================================================
   初始化（顺序固定：注入图标 → 载数据 → 绑事件 → 统一渲染）
   ========================================================================= */
function init(){
  injectIcons();
  loadSettings();
  loadData();
  UI.zoom = DB.ui.zoom || 1;
  UI.todoOpen = true;
  bindEvents();
  histReset();
  refreshAll();
  if (DB.isSeed){
    setTimeout(() => toast('已预置 3 份示例工作流，可直接改，也能新建'), 800);
  }
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
