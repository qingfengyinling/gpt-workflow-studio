<!DOCTYPE html>
<!-- 工作流编排台 · 单文件本地工作台（零依赖 / 全内联 / localStorage 持久化） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工作流编排台</title>
<style>
:root{
  --bg:#0d1219; --bg2:#121a25; --panel:#151e2b; --card:#1a2434; --card2:#1f2b3d;
  --line:#28354a; --line2:#33425c;
  --tx:#e7eef8; --tx2:#93a3bb; --tx3:#657691;
  --pri:#4f8cff; --pri-d:#2f6fe0; --pri-s:rgba(79,140,255,.14);
  --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --human:#ec4899;
  --c-start:#22c55e; --c-llm:#4f8cff; --c-tool:#a855f7; --c-branch:#f59e0b; --c-human:#ec4899; --c-output:#14b8a6;
  --r:12px; --r2:10px; --sh:0 6px 24px rgba(0,0,0,.35);
  --fs:15px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--tx); font-size:var(--fs);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.55; overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea,select{
  background:var(--bg2); border:1px solid var(--line); border-radius:8px;
  padding:9px 11px; width:100%; font-size:16px; outline:none; transition:border-color .15s;
}
input:focus,textarea:focus,select:focus{border-color:var(--pri)}
textarea{resize:vertical;line-height:1.6}
::placeholder{color:var(--tx3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2b374d;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a4a66}

/* ---------- 通用件 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:38px;padding:0 13px;border-radius:9px;background:var(--card2);
  border:1px solid var(--line);color:var(--tx);font-size:14px;font-weight:500;
  transition:.15s;white-space:nowrap;
}
.btn:hover{background:#26344a;border-color:var(--line2)}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn-pri:hover{background:var(--pri-d);border-color:var(--pri-d)}
.btn-gho{background:transparent;border-color:transparent;color:var(--tx2)}
.btn-gho:hover{background:var(--card);color:var(--tx)}
.btn-danger{color:#ff8a8a;border-color:#4a2b33}
.btn-danger:hover{background:#3a1f26;border-color:#6b3a45}
.btn-sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn-ico{min-height:38px;width:38px;padding:0}
.btn-block{width:100%}
.ico{width:16px;height:16px;flex:none;display:block}
.ico svg,.ico>svg.i-svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i-svg{width:16px;height:16px;flex:none;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn>svg.i-svg{width:15px;height:15px}
.brand .logo>svg.i-svg{width:16px;height:16px}
.chip{
  display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;
  font-size:11px;font-weight:600;background:var(--card2);color:var(--tx2);white-space:nowrap
}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:600}
.hint{color:var(--tx3);font-size:12.5px;line-height:1.5}
.sep{height:1px;background:var(--line);margin:10px 0}
.empty{padding:22px 12px;text-align:center;color:var(--tx3);font-size:13px}

/* ---------- 骨架 ---------- */
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#topbar{
  display:flex;align-items:center;gap:10px;padding:0 14px;height:56px;flex:none;
  background:var(--panel);border-bottom:1px solid var(--line);z-index:30;
}
#topbar{overflow:hidden}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15.5px;letter-spacing:.2px;white-space:nowrap;flex:none}
#canvasBar .wf-title{white-space:nowrap;flex:none}
#canvasBar .chip{flex:none}
.brand .logo{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--pri),#8b5cf6);color:#fff
}
.brand .logo svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand small{font-weight:500;font-size:11px;color:var(--tx3);display:block;letter-spacing:0;margin-top:-2px}
.top-sp{flex:1}
.store-badge{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;
  background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--tx2)
}
.store-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 6px var(--ok)}

#body{flex:1;display:flex;min-height:0;position:relative;overflow:hidden}

/* 左栏：工作流库 */
#sidebar{
  width:262px;flex:none;background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.pane-hd{
  display:flex;align-items:center;gap:8px;padding:12px 13px 9px;flex:none;
}
.pane-hd h3{margin:0;font-size:12px;font-weight:700;color:var(--tx3);letter-spacing:.8px;text-transform:uppercase}
.pane-hd .top-sp{flex:1}
.pane-bd{flex:1;overflow-y:auto;padding:0 10px 14px;min-height:0}

#wfList{display:flex;flex-direction:column;gap:7px}
.wf-item{
  padding:10px 11px;border-radius:var(--r2);background:var(--card);border:1px solid transparent;
  cursor:pointer;transition:.15s;position:relative;
}
.wf-item:hover{background:var(--card2)}
.wf-item.on{background:var(--pri-s);border-color:rgba(79,140,255,.45)}
.wf-item .wf-t{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:3px}
.wf-item .wf-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wf-item .wf-m{font-size:11.5px;color:var(--tx3);display:flex;gap:8px;flex-wrap:wrap}
.wf-dot{width:7px;height:7px;border-radius:50%;flex:none}
.wf-dot.ok{background:var(--ok)}.wf-dot.warn{background:var(--warn)}.wf-dot.err{background:var(--err)}
.wf-item .wf-t>span:nth-of-type(2){flex:1;min-width:0}
.wf-op{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--tx3);flex:none;opacity:.45;transition:.15s}
.wf-op svg{width:12.5px;height:12.5px}
.wf-item .wf-t{gap:5px}
.wf-item .wf-name{cursor:text}
.wf-op:hover{background:#2b374d;color:var(--tx);opacity:1}
.wf-item:hover .wf-op,.wf-item.on .wf-op{opacity:1}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:4px}
.stat{background:var(--card);border-radius:var(--r2);padding:9px 10px;border:1px solid var(--line)}
.stat b{display:block;font-size:19px;line-height:1.25;font-weight:700}
.stat i{font-style:normal;font-size:11px;color:var(--tx3)}

/* 中栏：待处理 + 画布 */
#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#todoBar{
  flex:none;background:var(--bg2);border-bottom:1px solid var(--line);padding:0 12px;
}
#todoBar.collapsed .todo-bd{display:none}
.todo-hd{
  display:flex;align-items:center;gap:9px;height:44px;cursor:pointer;user-select:none;
}
.todo-hd h3{margin:0;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.todo-hd .cnt{
  background:var(--err);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;
  border-radius:9px;display:grid;place-items:center;padding:0 5px
}
.todo-hd .cnt.zero{background:#2e3d54;color:var(--tx3)}
.todo-hd .top-sp{flex:1}
.todo-bd{padding:0 0 11px;display:flex;flex-direction:column;gap:7px;max-height:168px;overflow-y:auto}
.todo-row{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r2);
  background:var(--card);border-left:3px solid var(--tx3);
}
.todo-row.err{border-left-color:var(--err);background:linear-gradient(90deg,rgba(239,68,68,.10),transparent 60%),var(--card)}
.todo-row.warn{border-left-color:var(--warn);background:linear-gradient(90deg,rgba(245,158,11,.09),transparent 60%),var(--card)}
.todo-row.info{border-left-color:var(--pri)}
.todo-row .tr-tx{flex:1;min-width:0}
.todo-row .tr-t{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.todo-row .tr-s{font-size:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-allgood{
  display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:var(--r2);
  background:linear-gradient(90deg,rgba(34,197,94,.12),transparent 60%),var(--card);
  border-left:3px solid var(--ok);font-size:13.5px;color:var(--tx2)
}

#canvasWrap{flex:1;position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column}
#canvasBar{
  flex:none;display:flex;align-items:center;gap:7px;padding:9px 12px;
  background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;
  position:relative;z-index:6;
}
.zoom-box{display:flex;align-items:center;gap:1px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:2px;flex:none}
.zoom-box button{min-height:30px;width:30px;border-radius:7px;display:grid;place-items:center;color:var(--tx2)}
.zoom-box button:hover{background:var(--card2);color:var(--tx)}
.zoom-box button svg{width:14px;height:14px}
.zoom-box .zv{font-size:11.5px;color:var(--tx3);min-width:33px;text-align:center}
#canvasBar::-webkit-scrollbar{height:0}
#canvasBar .wf-title{font-size:14px;font-weight:700;margin-right:2px}
.view-switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:2px;flex:none}
.view-switch button{
  min-height:30px;padding:0 11px;border-radius:7px;font-size:13px;color:var(--tx3);
  display:flex;align-items:center;gap:5px;white-space:nowrap
}
.view-switch button.on{background:var(--card2);color:var(--tx)}

#canvasScroll{flex:1;overflow:auto;position:relative;min-height:0}
.grid-bg{
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(255,255,255,.032) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.032) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;
}
#canvasSize{position:relative}
#canvasStage{position:absolute;left:0;top:0;transform-origin:0 0}
#edgeLayer{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#edgeLayer path.edge{fill:none;stroke:#4a5f80;stroke-width:2;transition:stroke .15s}
#edgeLayer path.edge.hit{stroke:var(--pri);stroke-width:2.6}
#edgeLayer path.edge.temp{stroke:var(--pri);stroke-width:2.2;stroke-dasharray:6 5}
.edge-g{cursor:pointer;pointer-events:stroke}
.edge-g:hover path.edge{stroke:var(--pri)}
.edge-label{font-size:11px;fill:var(--tx2);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#0d1219;stroke-width:4px;stroke-linejoin:round;font-weight:600}
.edge-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke}

.node{
  position:absolute;width:212px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);
  cursor:grab;user-select:none;transition:border-color .15s,box-shadow .15s;
  touch-action:none;
}
.node:active{cursor:grabbing}
.node.link-ok{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-s),var(--sh);cursor:crosshair}
body.linking,body.linking .node{cursor:crosshair}
#tempEdge{pointer-events:none}
.node.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-s),var(--sh)}
.node.issue-warn{border-color:var(--warn)}
.node.issue-err{border-color:var(--err);box-shadow:0 0 0 2px rgba(239,68,68,.18),var(--sh)}
.node .nb{height:3px;width:100%;border-radius:11px 11px 0 0}
.node .nc{padding:9px 11px 10px}
.node .n-hd{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.node .n-seq{
  width:19px;height:19px;border-radius:6px;display:grid;place-items:center;flex:none;
  font-size:10.5px;font-weight:700;background:var(--card2);color:var(--tx2)
}
.node .n-t{font-size:13.5px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .n-badge{display:inline-flex;align-items:center;gap:3px;height:17px;padding:0 5px;border-radius:5px;font-size:10px;font-weight:700;flex:none;white-space:nowrap}
.node .n-badge svg{width:10px;height:10px;stroke-width:2.4}
.node .n-badge.hc{background:rgba(236,72,153,.2);color:#f9a8d4}
.node .n-badge.done{background:rgba(34,197,94,.18);color:#7ddda2}
.node .n-badge.no{background:rgba(245,158,11,.16);color:#f6c265}
.node .n-ty{font-size:10.5px;color:var(--tx3);display:flex;align-items:center;gap:6px;margin-bottom:5px}
.node .n-io{font-size:11.5px;color:var(--tx2);line-height:1.45}
.node .n-io em{font-style:normal;color:var(--tx3)}
.node .n-io div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .n-fl{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.port{
  position:absolute;width:13px;height:13px;border-radius:50%;background:var(--card2);
  border:2px solid #4a5f80;z-index:4;
}
.port.in{top:-7px;left:50%;margin-left:-6.5px}
.port.out{bottom:-7px;left:50%;margin-left:-6.5px;cursor:crosshair;border-color:var(--pri);background:var(--pri)}
.port.out::after{content:"";position:absolute;inset:-11px;border-radius:50%}
.node.hc{border-color:rgba(236,72,153,.5)}

#canvasHint{
  position:absolute;left:12px;bottom:10px;z-index:8;padding:6px 11px;border-radius:8px;
  background:rgba(21,30,43,.92);border:1px solid var(--line);font-size:11.5px;color:var(--tx3);
  backdrop-filter:blur(6px);pointer-events:none;transition:opacity .45s ease;
}
#canvasHint.fade{opacity:0}
#canvasEmpty{
  position:absolute;inset:0;display:grid;place-items:center;padding:24px;pointer-events:none;
  z-index:5;
}
#canvasEmpty .ce{
  max-width:330px;text-align:center;background:rgba(21,30,43,.9);border:1px dashed var(--line2);
  border-radius:var(--r);padding:22px 20px;backdrop-filter:blur(4px)
}
#canvasEmpty h4{margin:0 0 6px;font-size:15px}
#canvasEmpty p{margin:0 0 14px;font-size:13px;color:var(--tx3)}
#canvasEmpty .row{display:flex;gap:8px;justify-content:center;pointer-events:auto}

/* 列表视图 */
#listView{flex:1;overflow-y:auto;padding:14px}
.seq-list{display:flex;flex-direction:column;gap:9px;max-width:820px;margin:0 auto}
.seq-item{
  display:flex;gap:11px;padding:12px;border-radius:var(--r);background:var(--card);
  border:1px solid var(--line);cursor:pointer;transition:.15s;
}
.seq-item:hover{background:var(--card2)}
.seq-item.on{border-color:var(--pri);background:var(--pri-s)}
.seq-item .si-n{
  width:27px;height:27px;border-radius:8px;display:grid;place-items:center;flex:none;
  font-size:12px;font-weight:700;background:var(--card2)
}
.seq-item .si-b{flex:1;min-width:0}
.seq-item .si-t{font-size:14px;font-weight:650;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.seq-item .si-m{font-size:12px;color:var(--tx3);margin-top:3px}
.seq-item .si-x{font-size:12.5px;color:var(--tx2);margin-top:6px;display:flex;flex-direction:column;gap:2px}
.seq-item .si-x span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seq-item .si-x em{font-style:normal;color:var(--tx3)}
.arrow-down{display:grid;place-items:center;color:var(--tx3);height:14px;width:27px;margin-left:5.5px}

/* 右栏：属性面板 */
#inspector{
  width:328px;flex:none;background:var(--bg2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
#inspBd{flex:1;overflow-y:auto;padding:0 13px 16px;min-height:0}
.fld{margin-bottom:11px}
.fld label{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:5px;min-height:18px}
.fld label i{flex:1;min-width:0;font-style:normal;color:var(--tx3);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld label .cnt-hint{font-weight:500;color:var(--tx3);font-size:11px;white-space:nowrap;flex:none}
.fld-x{font-size:11px;font-weight:500;color:var(--tx3);padding:1px 7px;border-radius:5px;white-space:nowrap;flex:none;transition:.15s}
.fld-x:hover{background:var(--card2);color:#ff9d9d}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.type-picker{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.type-opt{
  display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:9px;
  background:var(--card);border:1px solid var(--line);font-size:12.5px;transition:.15s;
}
.type-opt:hover{background:var(--card2)}
.type-opt.on{border-color:var(--pri);background:var(--pri-s)}
.type-opt .td{width:9px;height:9px;border-radius:3px;flex:none}
.switch{display:flex;align-items:center;gap:9px;cursor:pointer;padding:8px 0}
.switch input{display:none}
.switch .sw{
  width:40px;height:23px;border-radius:12px;background:#2c3a51;position:relative;transition:.2s;flex:none
}
.switch .sw::after{
  content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;
  background:#fff;transition:.2s
}
.switch input:checked+.sw{background:var(--human)}
.switch input:checked+.sw::after{transform:translateX(17px)}
.switch .lb{font-size:13px;color:var(--tx2)}
.insp-hd{display:flex;align-items:center;gap:8px;padding:13px 0 9px}
.insp-hd h3{margin:0;font-size:13px;font-weight:700;color:var(--tx3);letter-spacing:.6px;text-transform:uppercase}
.insp-hd .top-sp{flex:1}
.node-flag{margin:0 0 11px;padding:9px 11px;border-radius:9px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.node-flag.warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#f6c265}
.node-flag.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.32);color:#ff9d9d}

/* 导出抽屉 */
#mask{
  position:fixed;inset:0;background:rgba(6,10,16,.66);backdrop-filter:blur(3px);
  z-index:90;display:none;align-items:flex-start;justify-content:center;padding:22px 14px;
  overflow-y:auto;
}
#mask.on{display:flex}
#exportPanel{
  width:100%;max-width:860px;background:var(--panel);border:1px solid var(--line2);
  border-radius:16px;box-shadow:0 22px 60px rgba(0,0,0,.55);overflow:hidden;
  animation:pop .2s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.exp-hd{display:flex;align-items:center;gap:9px;padding:15px 17px;border-bottom:1px solid var(--line)}
.exp-hd h2{margin:0;font-size:16px;font-weight:700}
.exp-hd .top-sp{flex:1}
.tabs{display:flex;gap:5px;padding:11px 17px 0;overflow-x:auto}
.tabs button{
  min-height:34px;padding:0 13px;border-radius:9px 9px 0 0;font-size:13.5px;color:var(--tx3);
  border-bottom:2px solid transparent;white-space:nowrap
}
.tabs button.on{color:var(--tx);border-bottom-color:var(--pri);background:var(--bg2)}
.exp-bd{padding:15px 17px 17px;background:var(--bg2)}
.check-sum{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.check-pill{
  display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:9px;flex:1;min-width:130px;
  background:var(--card);border:1px solid var(--line)
}
.check-pill b{font-size:17px;font-weight:700}
.check-pill i{font-style:normal;font-size:11.5px;color:var(--tx3);display:block}
.issue-list{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow-y:auto;margin-bottom:13px}
.issue{
  display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;font-size:13px;
  background:var(--card);border-left:3px solid var(--tx3)
}
.issue.err{border-left-color:var(--err)}
.issue.warn{border-left-color:var(--warn)}
.issue.info{border-left-color:var(--pri)}
.issue .top-sp{flex:1}
.code-box{
  background:#0a0f16;border:1px solid var(--line);border-radius:var(--r2);
  padding:13px 14px;font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
  font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
  max-height:390px;overflow-y:auto;color:#c7d4e6
}
.code-box .k{color:#7cc4ff}.code-box .s{color:#9ee6a8}.code-box .c{color:#5d7597}.code-box .h{color:#ffd479}
.exp-ft{display:flex;gap:8px;flex-wrap:wrap;padding:12px 17px;border-top:1px solid var(--line);background:var(--panel)}
.fmt-note{
  display:flex;gap:9px;padding:10px 12px;border-radius:9px;background:var(--card);
  border:1px solid var(--line);font-size:12.5px;color:var(--tx2);margin-bottom:12px;align-items:flex-start
}
.fmt-note svg{width:15px;height:15px;flex:none;margin-top:2px;stroke:var(--pri);fill:none;stroke-width:2;stroke-linecap:round}
.import-area{display:flex;flex-direction:column;gap:10px}
.import-area textarea{min-height:190px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}

/* ---------- 右键菜单 ---------- */
#ctxMenu{
  position:fixed;z-index:110;min-width:190px;max-width:290px;padding:5px;
  background:var(--panel);border:1px solid var(--line2);border-radius:11px;
  box-shadow:0 14px 42px rgba(0,0,0,.6);display:none;
}
#ctxMenu.on{display:block;animation:pop .13s ease}
.ctx-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
  font-size:13.5px;cursor:pointer;color:var(--tx);white-space:nowrap;
}
.ctx-item:hover{background:var(--card2)}
.ctx-item.danger{color:#ff9d9d}
.ctx-item.danger:hover{background:#3a1f26}
.ctx-item .ico{width:15px;height:15px;color:var(--tx3)}
.ctx-item.danger .ico{color:#ff9d9d}
.ctx-item .kbd{margin-left:auto;font-size:11px;color:var(--tx3);padding-left:16px;font-family:ui-monospace,Consolas,monospace}
.ctx-item.disabled{opacity:.38;pointer-events:none}
.ctx-sep{height:1px;background:var(--line);margin:4px 6px}
.ctx-title{padding:7px 10px 4px;font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.6px}

/* ---------- 框选矩形 ---------- */
#boxRect{
  position:fixed;z-index:22;border:1px solid var(--pri);
  background:rgba(79,140,255,.14);border-radius:2px;display:none;pointer-events:none;
}
#boxRect.on{display:block}

/* ---------- 就地改名浮层 ---------- */
#inlineEditor{
  position:fixed;z-index:105;background:var(--card2);border:1px solid var(--pri);
  border-radius:8px;padding:4px 8px;font-size:13.5px;font-weight:650;color:var(--tx);
  box-shadow:0 8px 26px rgba(0,0,0,.55);width:184px;
}
.node.on.primary{border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,140,255,.28),var(--sh)}

/* ---------- 操作设置面板 ---------- */
#settingsPanel{
  width:100%;max-width:780px;background:var(--panel);border:1px solid var(--line2);
  border-radius:16px;box-shadow:0 22px 60px rgba(0,0,0,.55);overflow:hidden;
  animation:pop .2s ease;
}
#setBd{max-height:min(60vh, 540px);overflow-y:auto}
.key-row{
  display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;
  background:var(--card);border:1px solid var(--line);margin-bottom:6px;
}
.key-row .kr-l{flex:1;font-size:13.5px;min-width:0}
.key-row .kr-g{font-size:11px;color:var(--tx3);margin-left:7px}
.key-btn{
  width:158px;min-width:158px;min-height:34px;padding:0 10px;border-radius:8px;background:var(--bg2);
  border:1px solid var(--line2);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:12.5px;color:var(--tx);transition:.15s;text-align:center;flex:none;
}
.key-btn:hover{border-color:var(--pri)}
.key-btn.rec{background:var(--pri-s);border-color:var(--pri);color:var(--pri)}
.key-btn.conflict{border-color:var(--err);color:#ff9d9d}
.set-group{margin:12px 0 8px;font-size:11.5px;font-weight:700;color:var(--tx3);letter-spacing:.7px;text-transform:uppercase}
.set-row{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;
  background:var(--card);border:1px solid var(--line);margin-bottom:7px;
}
.set-row .sr-l{flex:1;min-width:0}
.set-row .sr-t{font-size:13.5px;font-weight:600}
.set-row .sr-h{font-size:11.5px;color:var(--tx3);margin-top:2px;line-height:1.5}
.set-row select{width:auto;min-width:124px;flex:none;min-height:38px;padding:6px 9px}

/* 浮动提示 */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);z-index:120;
  background:#1f2b3d;border:1px solid var(--line2);border-radius:11px;padding:11px 17px;
  font-size:13.5px;box-shadow:0 12px 34px rgba(0,0,0,.5);opacity:0;transition:.25s;max-width:88vw;
  display:flex;align-items:center;gap:9px
}
#toast.on{transform:translate(-50%,0);opacity:1}
#toast .t-ico{width:17px;height:17px;flex:none;border-radius:50%;display:grid;place-items:center}
#toast .t-ico svg{width:11px;height:11px;stroke-width:2.6;fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}

/* 移动端底部 Tab */
#mobTab{
  display:none;flex:none;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#mobTab button{
  flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:10.5px;color:var(--tx3);padding:6px 2px
}
#mobTab button.on{color:var(--pri)}
#mobTab .ico{width:20px;height:20px}
#mobOnlyBar{display:none;align-items:center;gap:7px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line)}

/* ---------- 响应式 ---------- */
@media (max-width:1100px){
  #inspector{width:290px}
  #sidebar{width:230px}
}
@media (max-width:900px){
  #sidebar,#inspector{
    position:absolute;top:0;bottom:0;z-index:40;box-shadow:0 0 40px rgba(0,0,0,.5)
  }
  #sidebar{left:0;width:82vw;max-width:318px;transform:translateX(-101%);transition:transform .22s}
  #inspector{right:0;width:88vw;max-width:390px;transform:translateX(101%);transition:transform .22s}
  body.pane-l #sidebar{transform:none}
  body.pane-r #inspector{transform:none}
  body.pane-l::before,body.pane-r::before{
    content:"";position:fixed;inset:0;background:rgba(6,10,16,.55);z-index:35;
  }
  #mobTab{display:flex}
  #mobOnlyBar{display:flex}
  #topbar{height:52px;padding:0 11px}
  .brand small{display:none}
  .pane-close{display:inline-flex!important}
  .node{width:196px}
  #canvasHint{font-size:11px;left:8px;bottom:8px}
  /* 移动端触摸目标放大到 44px */
  .btn,.btn-sm{min-height:44px}
  .btn-sm{padding:0 13px}
  .btn-ico{width:44px}
  .zoom-box button{min-height:40px;width:44px}
  .view-switch button{min-height:44px;padding:0 14px}
  .wf-op{width:44px;height:44px;opacity:.9}
  .wf-op svg{width:15px;height:15px}
  .wf-item{padding:12px 10px 12px 12px}
  .pane-hd .pane-close,.insp-hd .pane-close{min-height:44px;width:44px}
  .pane-hd .btn{min-height:44px}
  #mobTab button{min-height:56px}
  /* 窄屏信息降噪：名称已在「库/名称/属性」条上，画布工具条只留操作 */
  #canvasBar .wf-title,#canvasBar #wfStat{display:none}
  #canvasBar>.top-sp{display:none}
  .zoom-box{display:none}
  .view-switch{display:none}
  #btnAuto{width:44px;padding:0;font-size:0;justify-content:center}
  #btnAuto>svg.i-svg{width:17px;height:17px}
  .store-badge{padding:0 9px}
  .store-badge>span:last-child{display:none}
  .brand{font-size:14.5px}
  #btnHelp{display:none}
  #topbar{gap:7px;padding:0 9px}
}
@media (max-width:640px){
  :root{--fs:14.5px}
  #todoTip{display:none}
  #todoBar{padding:0 9px;max-height:none}
  .todo-hd{height:42px}
  #canvasBar{padding:8px 9px;gap:6px}
  .btn{padding:0 11px}
  .stat-grid{grid-template-columns:1fr 1fr}
  #exportPanel{border-radius:13px}
  .exp-hd,.exp-ft,.tabs,.exp-bd{padding-left:13px;padding-right:13px}
  .fld-row{grid-template-columns:1fr}
  .check-pill{min-width:calc(50% - 5px)}
}
.pane-close{display:none;min-height:34px;width:34px;align-items:center;justify-content:center;border-radius:8px;background:var(--card);border:1px solid var(--line)}
@media print{body{overflow:visible}}
</style>
</head>
<body>
<div id="app">
  <!-- ========== 顶栏 ========== -->
  <header id="topbar">

<script>
/* =========================================================================
   工作流编排台 · 全部逻辑内联
   架构（严格单向 DAG，禁止渲染函数互调）：
     数据层  storage  →  计算层  calc  →  渲染层  render*  →  交互层  events
     统一刷新入口：refreshAll()   —— 唯一允许调度各渲染函数的地方
   ========================================================================= */
/* ======================= 数据层 storage ======================= */
const LS_KEY = 'wb_workflow_studio_v1';
const APP_VER = '1.0.0';
const TYPE_META = {
  start : { label:'起点 / 输入',  color:'#22c55e', hint:'流程入口，定义本次任务的原始输入与前置条件' },
  llm   : { label:'模型指令',     color:'#4f8cff', hint:'交给 AI 执行的一步，务必写清指令、输出格式与验收标准' },
  tool  : { label:'工具 / 接口',  color:'#a855f7', hint:'调用脚本、外部工具或 API 完成的一步' },
  branch: { label:'条件分支',     color:'#f59e0b', hint:'按判断条件走不同路径，请在连线上标注分支含义' },
  human : { label:'人工确认',     color:'#ec4899', hint:'必须由人确认后才能继续；Agent 执行到此必须停下等待' },
  output: { label:'终点 / 交付',  color:'#14b8a6', hint:'流程产出物，写清交付形态、位置与验收口径' }
};
const TYPE_ORDER = ['start','llm','tool','branch','human','output'];
let MEM_FALLBACK = false;   // localStorage 不可用时的内存兜底标记

function uid(p){ return (p||'id') + '_' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function nowISO(){ return new Date().toISOString(); }
function daysAgo(n){ return new Date(Date.now() - n*86400000).toISOString(); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ---------- 示例数据（预置 3 条：1 条完整可用 / 1 条含结构问题 / 1 条空白草稿） ---------- */
function seedData(){
  const mkNode = (o) => Object.assign({
    id:uid('n'), type:'llm', title:'未命名节点', x:120, y:60,
    role:'', model:'', instruction:'', inputs:'', outputs:'',
    acceptance:'', forbidden:'', timeoutSec:0, retry:0,
    humanCheck:false, checked:false, notes:''
  }, o);

  const wf1 = {
    id:'wf_demo_content', name:'内容创作流水线',
    goal:'把一条选题做成可直接发布的图文内容，全程可追溯、可控稿。',
    delivery:'一篇 1500 字左右的公众号图文 + 配图说明 + 发布检查单。',
    constraints:'不得编造数据与引用；涉及事实必须给出可核查来源；不得使用夸大或绝对化表述。',
    createdAt:daysAgo(9), updatedAt:daysAgo(2),
    nodes:[
      mkNode({ id:'a1', type:'start', title:'接收选题', x:140, y:30,
        role:'人类（发起方）',
        instruction:'发起人给出选题方向、目标读者、期望调性与参考素材链接。',
        inputs:'选题方向 / 目标读者 / 调性要求 / 参考素材',
        outputs:'一份结构化的选题单（含三项信息）',
        acceptance:'三项信息齐全，目标读者具体到人群画像而非泛称。',
        forbidden:'不得在信息缺失时自行假设目标读者。' }),
      mkNode({ id:'a2', type:'llm', title:'选题分析', x:140, y:190,
        role:'AI 策划', model:'通用大模型',
        instruction:'解析选题单，产出：核心观点一句话、读者痛点 3 条、内容大纲（4-6 段，每段一句主题）。',

function loadData(){
  let raw = null;
  try { raw = localStorage.getItem(LS_KEY); }
  catch(e){ MEM_FALLBACK = true; }
  if (!raw){
    DB = seedData();
    saveData(true);
    return;
  }
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.workflows)) throw new Error('bad shape');
    DB = normalizeDB(parsed);
  } catch(e){
    DB = seedData();
    saveData(true);
  }
}

/* 文本归一：导出格式里 inputs/outputs/forbidden 是数组，内部统一存换行分隔的字符串 */
function toText(v){
  if (Array.isArray(v)) return v.filter(x => x !== null && x !== undefined && String(x).trim() !== '').join('\n');
  return v === null || v === undefined ? '' : String(v);
}
function pickText(){
  for (let i = 0; i < arguments.length; i++){
    const v = arguments[i];
    if (v !== null && v !== undefined && String(v) !== '') return toText(v);
  }
  return '';
}

function normalizeDB(d){
  d.workflows = (d.workflows||[]).map(w => ({
    id: w.id || uid('wf'),
    name: toText(w.name) || '未命名工作流',
    goal: toText(w.goal), delivery: toText(w.delivery), constraints: toText(w.constraints),
    createdAt: w.createdAt || nowISO(),
    updatedAt: w.updatedAt || nowISO(),
    nodes: (w.nodes||[]).map(n => ({
      id: n.id || uid('n'),
      type: TYPE_META[n.type] ? n.type : 'llm',
      title: toText(n.title) || '未命名节点',
      x: typeof n.x === 'number' ? n.x : 120,
      y: typeof n.y === 'number' ? n.y : 60,
      role: pickText(n.role, n.owner),
      model: toText(n.model),
      instruction: toText(n.instruction),
      inputs: toText(n.inputs),
      outputs: toText(n.outputs),
      acceptance: toText(n.acceptance),
      forbidden: toText(n.forbidden),
      timeoutSec: Number(n.timeoutSec) || 0,
      retry: Number(n.retry) || 0,
      humanCheck: !!(n.humanCheck || n.humanCheckpoint),
      checked: !!(n.checked || n.confirmed),
      notes: toText(n.notes)
    })),
    edges: (w.edges||[]).filter(e=>e && e.from && e.to)
      .map(e => ({ id:e.id||uid('e'), from:e.from, to:e.to, label:e.label||'' }))
  }));
  if (!d.workflows.length) d.workflows = [blankWorkflow('我的第一个工作流')];
  if (!d.workflows.some(w=>w.id===d.activeWfId)) d.activeWfId = d.workflows[0].id;
  d.ui = d.ui || {};
  d.ui.view = d.ui.view==='list' ? 'list' : 'canvas';
  d.ui.zoom = (typeof d.ui.zoom==='number' && d.ui.zoom>0.3 && d.ui.zoom<2.5) ? d.ui.zoom : 1;
  d.ui.selectedIds = Array.isArray(d.ui.selectedIds) ? d.ui.selectedIds.filter(Boolean) : [];
  d.schema = 'workflow-studio/v1';
  d.appVersion = APP_VER;
  return d;
}

function saveData(immediate){
  if (SAVE_TIMER){ clearTimeout(SAVE_TIMER); SAVE_TIMER=null; }
  const write = () => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); setStoreBadge('本地存储 · 已保存', 'ok'); }
    catch(e){ MEM_FALLBACK = true; setStoreBadge('内存模式 · 未持久化','warn'); }
  };
  if (immediate) { write(); return; }
  setStoreBadge(MEM_FALLBACK ? '内存模式' : '本地存储 · 保存中…', 'busy');
  SAVE_TIMER = setTimeout(write, 320);
}

function touchWf(wf){ if (wf) wf.updatedAt = nowISO(); }

/* ======================= 计算层 calc ======================= */
function getWf(id){
  const target = id || (DB && DB.activeWfId);
  return (DB.workflows.find(w=>w.id===target)) || DB.workflows[0] || null;
}
function getActiveWf(){ return getWf(DB.activeWfId); }
function getNode(wf, id){ return wf ? (wf.nodes.find(n=>n.id===id) || null) : null; }
function nodeById(id){
  for (const w of DB.workflows){ const n = w.nodes.find(x=>x.id===id); if (n) return { wf:w, node:n }; }
  return null;
}
function edgesOf(wf, nodeId){ return wf.edges.filter(e=>e.from===nodeId); }
function inEdgesOf(wf, nodeId){ return wf.edges.filter(e=>e.to===nodeId); }

function buildAdj(wf){
  const adj = {}, indeg = {};
  wf.nodes.forEach(n=>{ adj[n.id]=[]; indeg[n.id]=0; });
  wf.edges.forEach(e=>{
    if (adj[e.from] !== undefined && indeg[e.to] !== undefined && e.from!==e.to){
      adj[e.from].push(e.to); indeg[e.to]++;
    }
  });
  return { adj, indeg };
}

/* 拓扑排序（Kahn）；有环时剩余节点按原顺序接尾，保证列表不丢节点 */
function topoSort(wf){
  const { adj, indeg } = buildAdj(wf);
  const deg = Object.assign({}, indeg);
  const q = wf.nodes.filter(n=>deg[n.id]===0).map(n=>n.id);
  const out = [];
  while (q.length){
    const u = q.shift();
    out.push(u);
    (adj[u]||[]).forEach(v => { if (--deg[v] === 0) q.push(v); });
  }
  wf.nodes.forEach(n=>{ if (out.indexOf(n.id) < 0) out.push(n.id); });
  return out;
}

/* 环路检测：DFS 三色标记，返回环上节点 id 集合 */
function findCycleIds(wf){
  const { adj } = buildAdj(wf);
  const color = {}, stack = [], cyc = new Set();
  const dfs = (u) => {
    color[u] = 1; stack.push(u);
    (adj[u]||[]).forEach(v=>{
      if (color[v] === 1){
        const i = stack.indexOf(v);
        for (let k=i; k<stack.length; k++) cyc.add(stack[k]);
      } else if (!color[v]) dfs(v);
    });
    stack.pop(); color[u] = 2;
  };
  wf.nodes.forEach(n=>{ if (!color[n.id]) dfs(n.id); });
  return cyc;
}

function seqMap(wf){
  const order = topoSort(wf), m = {};
  order.forEach((id,i)=>{ m[id] = i+1; });
  return m;
}

/* 结构校验：返回 { errors, warnings, infos, ok, score } */
function validateWorkflow(wf){
  const errors = [], warnings = [], infos = [];
  if (!wf || !wf.nodes.length){
    errors.push({ level:'err', scope:'wf', msg:'工作流还没有任何节点', fix:'添加节点后即可编排' });
    return { errors, warnings, infos, ok:false, score:0 };
  }
  const starts  = wf.nodes.filter(n=>n.type==='start');
  const outputs = wf.nodes.filter(n=>n.type==='output');

  if (!starts.length) errors.push({ level:'err', scope:'wf', msg:'缺少「起点 / 输入」节点，Agent 无法判断流程入口', fix:'新增一个起点节点' });
  if (starts.length > 1) warnings.push({ level:'warn', scope:'wf', msg:`存在 ${starts.length} 个起点节点，执行顺序存在歧义`, fix:'合并为单一入口' });
  if (!outputs.length) errors.push({ level:'err', scope:'wf', msg:'缺少「终点 / 交付」节点，交付物定义不闭环', fix:'新增一个终点节点' });

  const cyc = findCycleIds(wf);
  if (cyc.size) errors.push({ level:'err', scope:'wf', nodeIds:[...cyc],
    msg:`检测到循环依赖（${cyc.size} 个节点成环），Agent 逐节点执行会死循环`, fix:'打断环上的连线' });

  wf.nodes.forEach(n=>{
    const ins = inEdgesOf(wf, n.id).length, outs = edgesOf(wf, n.id).length;
    if (n.type !== 'start' && ins === 0 && n.type !== 'output'){
      warnings.push({ level:'warn', scope:'node', nodeId:n.id,
        msg:`「${n.title}」未接入流程（没有上游）`, fix:'从上游节点连线过来' });
    }
    if (n.type !== 'output' && outs === 0 && n.type !== 'start'){
      warnings.push({ level:'warn', scope:'node', nodeId:n.id,
        msg:`「${n.title}」没有下游，执行到此会中断`, fix:'连向下一个节点' });
    }
    if (n.type === 'start' && outs === 0){
      warnings.push({ level:'warn', scope:'node', nodeId:n.id, msg:'起点没有连出任何流程', fix:'连接到下一步' });
    }
    if ((n.type==='llm' || n.type==='tool') && !(n.instruction||'').trim()){
      warnings.push({ level:'warn', scope:'node', nodeId:n.id,
        msg:`「${n.title}」没有填写执行指令，Agent 不知道这一步要做什么`, fix:'补充执行指令' });
    }
    if (!(n.outputs||'').trim()){
      infos.push({ level:'info', scope:'node', nodeId:n.id,
        msg:`「${n.title}」未声明输出，交接时对方无法校验产出`, fix:'补充输出契约' });
    }
    if (n.type === 'human' && !(n.checked) && !((n.role||'').trim())){
      infos.push({ level:'info', scope:'node', nodeId:n.id,
        msg:`「${n.title}」人工卡点未标注确认人`, fix:'注明由谁确认' });
    }
    if (!(n.acceptance||'').trim() && n.type!=='branch'){
      infos.push({ level:'info', scope:'node', nodeId:n.id,
        msg:`「${n.title}」缺少验收标准`, fix:'补充可判定的验收口径' });
    }
  });

  const total = errors.length*1 + warnings.length*0.4 + infos.length*0.12;
  const ok = errors.length === 0;
  const score = Math.max(0, Math.round(100 - total*9));
  return { errors, warnings, infos, ok, score };
}

function humanPending(wf){
  return wf.nodes.filter(n => n.type==='human' && !n.checked);
}

/* 待办聚合：跨全部工作流，err > warn > info */
function computeTodos(){
  const list = [];
  DB.workflows.forEach(wf => {
    const v = validateWorkflow(wf);
    if (!wf.nodes.length){
      list.push({ level:'err', wfId:wf.id, nodeId:null, action:'add',
        text:`《${wf.name}》还是空的`, sub:'没有任何节点，先加一个起点再开始编排', btn:'+ 加节点' });
      return;
    }
    v.errors.forEach(e => {
      list.push({ level:'err', wfId:wf.id, nodeId:(e.nodeIds&&e.nodeIds[0])||null, action:'fix',
        text:`《${wf.name}》${e.msg}`, sub:e.fix, btn:'去修复' });
    });
    v.warnings.forEach(w => {
      list.push({ level:'warn', wfId:wf.id, nodeId:w.nodeId||null, action:'locate',
        text:`《${wf.name}》${w.msg}`, sub:w.fix, btn:'定位' });
    });
    humanPending(wf).forEach(n => {
      list.push({ level:'warn', wfId:wf.id, nodeId:n.id, action:'confirm',
        text:`《${wf.name}》人工卡点「${n.title}」待确认`, sub:'确认通过后 Agent 才能继续执行', btn:'标记已确认' });
    });
    const idle = (Date.now() - new Date(wf.updatedAt||wf.createdAt).getTime()) / 86400000;
    if (idle > 14 && wf.nodes.length){
      list.push({ level:'info', wfId:wf.id, nodeId:null, action:'open',
        text:`《${wf.name}》已 ${Math.floor(idle)} 天没有更新`, sub:'建议确认是否还需要，或者补全后导出交接包', btn:'打开' });
    }
  });
  const rank = { err:0, warn:1, info:2 };
  return list.sort((a,b)=> rank[a.level]-rank[b.level] );
}

function countHumanPending(){

}
function countPass(){
  return DB.workflows.filter(w=> w.nodes.length && validateWorkflow(w).ok).length;
}
function fmtDate(iso){
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function fmtTime(iso){
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function splitLines(s){
  return String(s||'').split(/[\n,，;；]+/).map(x=>x.trim()).filter(Boolean);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================================
   撤销 / 重做（快照式历史栈；merge=true 时连续同类操作合并为一步）
   ========================================================================= */
const HIST = { stack:[], index:-1, limit:80, lock:false, lastLabel:'', lastTime:0 };

function commit(label, merge){
  if (!DB || HIST.lock) return;
  const snap = JSON.stringify(DB);
  if (HIST.index >= 0 && HIST.stack[HIST.index] === snap) return;
  const now = Date.now();
  if (merge && HIST.index > 0 && HIST.lastLabel === label && now - HIST.lastTime < 1600){
    HIST.stack[HIST.index] = snap;
    HIST.lastTime = now;
    return;
  }
  HIST.stack = HIST.stack.slice(0, HIST.index + 1);
  HIST.stack.push(snap);
  if (HIST.stack.length > HIST.limit) HIST.stack.shift();
  HIST.index = HIST.stack.length - 1;
  HIST.lastLabel = label;
  HIST.lastTime = now;
}
function undo(){
  if (HIST.index <= 0){ toast('没有可撤销的操作了','warn'); return; }
  HIST.index--;
  applySnap(HIST.stack[HIST.index]);
  toast('已撤销');
}
function redo(){
  if (HIST.index >= HIST.stack.length - 1){ toast('没有可重做的操作了','warn'); return; }
  HIST.index++;
  applySnap(HIST.stack[HIST.index]);
  toast('已重做');
}
function applySnap(s){
  HIST.lock = true;
  try {
    DB = normalizeDB(JSON.parse(s));
    saveData(true);
  } finally { HIST.lock = false; }
  refreshAll();
}
function histReset(){
  HIST.stack = [];
  HIST.index = -1;
  HIST.lastLabel = '';
  HIST.lastTime = 0;
  HIST.lock = false;
  commit('init');
}

function renderHistBar(){
  const u = document.getElementById('btnUndo'), r = document.getElementById('btnRedo');
  const canUndo = HIST.index > 0, canRedo = HIST.index < HIST.stack.length - 1;
  if (u){ u.disabled = !canUndo; u.title = '撤销（' + (keyOf('undo') || '—') + '）'; }
  if (r){ r.disabled = !canRedo; r.title = '重做（' + (keyOf('redo') || '—') + '）'; }
}

function renderTodo(){

  const bd = document.getElementById('todoBd');
  const bar = document.getElementById('todoBar');
  const tip = document.getElementById('todoTip');

  cnt.textContent = items.length;

  const nErr = items.filter(x=>x.level==='err').length;

  if (tip) tip.textContent = items.length
    ? (nErr ? nErr + ' 项结构问题需修复' : '') + (nErr && nWarn ? ' · ' : '') + (nWarn && !nErr ? nWarn + ' 项需确认' : (nErr && nWarn ? nWarn + ' 项需确认' : ''))

const SVG_NS = 'http://www.w3.org/2000/svg';
const NODE_W = 212;

function hexA(hex, a){
  const h = String(hex||'#4f8cff').replace('#','');
  const r = parseInt(h.slice(0,2),16)||0, g = parseInt(h.slice(2,4),16)||0, b = parseInt(h.slice(4,6),16)||0;
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

/* 收集“问题节点”编号，用于画布高亮 */
function issueMapOf(wf){
  const v = validateWorkflow(wf);
  const map = {};
  v.errors.forEach(e => {
    const ids = e.nodeIds && e.nodeIds.length ? e.nodeIds : (e.nodeId ? [e.nodeId] : []);
    ids.forEach(id => { if (id) map[id] = 'err'; });
  });
  v.warnings.forEach(e => { if (e.nodeId && map[e.nodeId] !== 'err') map[e.nodeId] = 'warn'; });
  return map;
}

      badges += '<span class="n-badge no">' + svgIcon('alert') + '缺指令</span>';
    }

    const outFirst = splitLines(n.outputs)[0] || '';
    const inFirst = splitLines(n.inputs)[0] || '';

    el.innerHTML =

          '<span class="n-t" title="双击可改名"' + (isEditing('node', n.id) ? ' style="opacity:0"' : '') + '>' +

/* renderCanvas 的内部子步骤：绘制连线（不回调任何渲染函数） */
function drawEdgePaths(wf, stage){
  const g = document.getElementById('edgeG');
  if (!g) return;
  g.innerHTML = '';
  const cyc = findCycleIds(wf);
  wf.edges.forEach(e => {
    const na = getNode(wf, e.from), nb = getNode(wf, e.to);
    const a = stage.querySelector('.node[data-node-id="' + e.from + '"]');
    const b = stage.querySelector('.node[data-node-id="' + e.to + '"]');
    if (!na || !nb || !a || !b) return;

    const x1 = na.x + a.offsetWidth / 2, y1 = na.y + a.offsetHeight;
    const x2 = nb.x + b.offsetWidth / 2, y2 = nb.y;
    const dy = Math.max(38, Math.abs(y2 - y1) * 0.45);
    const d = 'M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + (y1 + dy) + ', ' + x2 + ' ' + (y2 - dy) + ', ' + x2 + ' ' + y2;
    const isCycle = cyc.has(e.from) && cyc.has(e.to);
    const isSelEdge = UI.selEdge === e.id;

    const grp = document.createElementNS(SVG_NS, 'g');
    grp.setAttribute('class', 'edge-g');
    grp.setAttribute('data-edge-id', e.id);
    grp.innerHTML =
      '<path class="edge-hit" d="' + d + '"></path>' +
      '<path class="edge' + ((isCycle || isSelEdge) ? ' hit' : '') + '" d="' + d +
        '" marker-end="url(#' + (isSelEdge ? 'arrowHi' : 'arrow') + ')"></path>';
    g.appendChild(grp);

    if (e.label){
      const p = grp.querySelector('path.edge');
      let mid = { x:(x1+x2)/2, y:(y1+y2)/2 };
      try { const pt = p.getPointAtLength(p.getTotalLength() / 2); mid = pt; } catch(err){}
      const t = document.createElementNS(SVG_NS, 'text');
      t.setAttribute('class', 'edge-label');
      t.setAttribute('x', mid.x);
      t.setAttribute('y', mid.y - 6);
      t.textContent = e.label;
      grp.appendChild(t);
    }
  });
}

const LIST_FIELDS = ['inputs','outputs','forbidden'];

/* 粘贴多行时自动整理成「一行一条」，去掉编号与项目符号 */
function onInspPaste(e){
  const el = e.target.closest ? e.target.closest('[data-f],[data-wf]') : null;
  if (!el || el.tagName !== 'TEXTAREA') return;
  const f = el.getAttribute('data-f') || el.getAttribute('data-wf') || '';
  if (LIST_FIELDS.indexOf(f) < 0) return;
  const cd = e.clipboardData || window.clipboardData;
  const txt = cd ? cd.getData('text') : '';
  if (!txt || txt.indexOf('\n') < 0) return;
  e.preventDefault();
  const lines = txt.split(/\r?\n/)
    .map(s => s.replace(/^\s*(?:[-*•·—]+|\d+[.、)）]|\(\d+\)|（\d+）)\s*/, '').trim())
    .filter(Boolean);
  const v = el.value;
  const s0 = el.selectionStart == null ? v.length : el.selectionStart;
  const s1 = el.selectionEnd == null ? v.length : el.selectionEnd;
  el.value = v.slice(0, s0) + lines.join('\n') + v.slice(s1);
  el.dispatchEvent(new Event('input', { bubbles:true }));
  toast('已整理为 ' + lines.length + ' 条');
}

/* =========================================================================
   模块 4 · 结构校验 / 导出（原生 JSON + Agent 交接包）/ 导入回灌
   ========================================================================= */
function safeFileName(s){
  return String(s || 'workflow').replace(/[\\/:*?"<>|]+/g,'_').replace(/\s+/g,'_').slice(0,40);
}
function downloadText(filename, text, mime){
  try{
    const blob = new Blob([text], { type:(mime || 'text/plain') + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
    return true;
  }catch(e){ toast('下载失败，请改用复制按钮','err'); return false; }
}
function copyText(text, okMsg){
  const done = ()=> toast(okMsg || '已复制到剪贴板');
  const fallback = ()=>{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.top = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
    ta.remove();
    ok ? done() : toast('复制失败，请手动框选文本','err');
  };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();
}

/* ---------- 工作流文件（原生 JSON，任何 agent 可解析） ---------- */
function buildWorkflowFile(wf){
  const order = topoSort(wf);
  const seq = {};
  order.forEach((id,i)=>{ seq[id] = i+1; });
  const v = validateWorkflow(wf);
  const startNode = wf.nodes.find(x=>x.type==='start');
  const endNode = wf.nodes.find(x=>x.type==='output');
  return {
    $schema:'workflow-studio/v1',
    format:'workflow-file',
    schemaVersion:'1.0',
    generator:'工作流编排台 (Workflow Studio) v' + APP_VER,
    exportedAt: nowISO(),
    readme:'本文件由工作流编排台导出。任何 Agent 请按 workflow.order 的顺序逐节点执行；humanCheckpoint 为 true 的节点必须停下并等待人类确认后再继续。outputs 与 acceptance 是判定该步是否完成的依据。',
    workflow:{
      id: wf.id,
      name: wf.name,
      goal: wf.goal,
      delivery: wf.delivery,
      constraints: wf.constraints,
      createdAt: wf.createdAt,
      updatedAt: wf.updatedAt,
      stats:{
        nodeCount: wf.nodes.length,
        edgeCount: wf.edges.length,
        humanCheckpoints: wf.nodes.filter(n=> n.humanCheck || n.type==='human').length,
        completenessScore: v.score
      },
      order: order.map(id => {
        const n = getNode(wf, id) || {};
        return { step: seq[id], id: id, title: n.title, type: n.type };
      }),
      nodes: wf.nodes.map(n => ({
        id: n.id,
        step: seq[n.id],
        type: n.type,
        typeLabel: (TYPE_META[n.type] || TYPE_META.llm).label,
        title: n.title,
        owner: n.role,
        model: n.model,
        instruction: n.instruction,
        inputs: splitLines(n.inputs),
        outputs: splitLines(n.outputs),
        acceptance: n.acceptance,
        forbidden: splitLines(n.forbidden),
        timeoutSec: n.timeoutSec || 0,
        retry: n.retry || 0,
        humanCheckpoint: !!(n.humanCheck || n.type === 'human'),
        confirmed: !!n.checked,
        notes: n.notes,
        dependsOn: inEdgesOf(wf, n.id).map(e=>e.from),
        next: edgesOf(wf, n.id).map(e=>e.to)
      })),
      edges: wf.edges.map(e => ({ id:e.id, from:e.from, to:e.to, label:e.label })),
      contracts:{
        globalInputs: splitLines(startNode ? startNode.inputs : ''),
        finalDeliverables: splitLines(wf.delivery || (endNode ? endNode.outputs : ''))
      },
      validation:{
        passed: v.ok,
        errors: v.errors.map(e=>e.msg),
        warnings: v.warnings.map(e=>e.msg)
      }
    }
  };
}

/* ---------- Mermaid 结构图（嵌在交接包内，零依赖纯文本） ---------- */
function buildMermaid(wf){
  const seq = seqMap(wf);
  const clean = s => String(s||'').replace(/["\[\]{}|()<>]/g,'').replace(/\s+/g,' ').trim().slice(0,22) || '未命名';
  let out = 'flowchart TD\n';
  wf.nodes.forEach(n => {
    out += '  N' + (seq[n.id]||'?') + '["' + (seq[n.id]||'?') + ' ' + clean(n.title) + '"]\n';
  });
  wf.edges.forEach(e => {
    out += '  N' + (seq[e.from]||'?') + (e.label ? ' -->|' + clean(e.label) + '| ' : ' --> ') + 'N' + (seq[e.to]||'?') + '\n';
  });
  return out;
}

/* ---------- Agent 交接包（人机双读 Markdown） ---------- */
function buildHandoff(wf){
  const order = topoSort(wf);
  const seq = {}; order.forEach((id,i)=>{ seq[id] = i+1; });
  const v = validateWorkflow(wf);
  const L = [];
  const nodeOf = id => getNode(wf, id) || {};

  L.push('# 工作流交接包 · ' + (wf.name || '未命名工作流'));
  L.push('');
  L.push('> 本文件可同时供人类与 AI Agent 阅读。');
  L.push('> Agent 请按「三、执行顺序」逐节点推进；遇到 `humanCheckpoint = true` 的节点必须停止并等待人类确认，不得自行跳过。');
  L.push('');
  L.push('- 导出时间：' + fmtTime(nowISO()));
  L.push('- 工作流 ID：`' + wf.id + '`');
  L.push('- 规模：共 ' + wf.nodes.length + ' 个节点 / ' + wf.edges.length + ' 条连线 / ' +
    wf.nodes.filter(n=> n.type==='human' || n.humanCheck).length + ' 个人工卡点');
  L.push('- 结构校验：' + (v.ok ? '通过（完整度 ' + v.score + ' 分）' : v.errors.length + ' 项问题待处理'));
  L.push('');
  L.push('## 一、流程目标');
  L.push('');
  L.push(wf.goal ? wf.goal : '_（未填写流程目标）_');
  L.push('');
  L.push('**最终交付物**');
  L.push('');
  L.push(wf.delivery ? wf.delivery : '_（未填写交付物定义）_');
  L.push('');
  L.push('**全局约束（红线）**');
  L.push('');
  const gcs = splitLines(wf.constraints);
  if (gcs.length) gcs.forEach((c,i)=> L.push((i+1) + '. ' + c));
  else L.push('_（未填写全局约束，建议补充）_');
  L.push('');
  L.push('## 二、结构总览');
  L.push('');
  L.push('```mermaid');
  L.push(buildMermaid(wf).replace(/\n$/,''));
  L.push('```');
  L.push('');
  L.push('## 三、执行顺序');
  L.push('');
  L.push('| 步骤 | 节点 | 类型 | 承担角色 | 人工卡点 |');
  L.push('| --- | --- | --- | --- | --- |');
  order.forEach(id => {
    const n = nodeOf(id);
    const hc = (n.type === 'human' || n.humanCheck) ? (n.checked ? '已确认' : '待确认') : '—';
    L.push('| ' + seq[id] + ' | ' + (n.title || '未命名') + ' | ' + ((TYPE_META[n.type]||TYPE_META.llm).label) +
      ' | ' + (n.role || '—') + ' | ' + hc + ' |');
  });
  L.push('');
  L.push('## 四、节点契约');
  L.push('');
  order.forEach(id => {
    const n = nodeOf(id);
    const meta = TYPE_META[n.type] || TYPE_META.llm;
    const ups = inEdgesOf(wf, id).map(e => '第 ' + seq[e.from] + ' 步 ' + (nodeOf(e.from).title || ''));
    const dns = edgesOf(wf, id).map(e => '第 ' + seq[e.to] + ' 步 ' + (nodeOf(e.to).title || ''));
    L.push('### 第 ' + seq[id] + ' 步 · ' + (n.title || '未命名') + '  `' + n.type + ' / ' + meta.label + '`');
    L.push('');
    L.push('- **承担角色**：' + (n.role || '未指定'));
    L.push('- **模型 / 工具**：' + (n.model || '未指定'));
    L.push('- **执行指令**：');
    if (n.instruction){
      String(n.instruction).split(/\n/).forEach(line => L.push('  > ' + line));
    } else {
      L.push('  > _（未填写，Agent 无法执行该步）_');
    }
    L.push('- **输入**：' + (splitLines(n.inputs).join(' / ') || '未声明'));
    L.push('- **输出契约**：' + (splitLines(n.outputs).join(' / ') || '未声明'));
    L.push('- **验收标准**：' + (n.acceptance || '未声明'));
    const fbs = splitLines(n.forbidden);
    L.push('- **禁止事项**：' + (fbs.length ? '' : '无'));
    fbs.forEach(f => L.push('  - ' + f));
    L.push('- **前置依赖**：' + (ups.length ? ups.join('；') : '无（流程起点）'));
    L.push('- **后续步骤**：' + (dns.length ? dns.join('；') : '无（流程终点）'));
    if (n.timeoutSec || n.retry) L.push('- **超时 / 重试**：' + (n.timeoutSec || '—') + ' 秒 / ' + (n.retry || 0) + ' 次');
    if (n.type === 'human' || n.humanCheck) L.push('- **⚠ 人工卡点**：是（当前状态：' + (n.checked ? '已确认' : '待确认') + '）');
    if (n.notes) L.push('- **备注**：' + n.notes);
    L.push('');
  });

  const hcs = wf.nodes.filter(n=> n.type==='human' || n.humanCheck);
  L.push('## 五、人工协作点');
  L.push('');
  if (hcs.length){
    L.push('| 步骤 | 节点 | 需要谁确认 | 确认内容 | 状态 |');
    L.push('| --- | --- | --- | --- | --- |');
    hcs.forEach(n => {
      const ask = splitLines(n.acceptance)[0] || n.instruction || '确认产出是否符合预期';
      L.push('| ' + seq[n.id] + ' | ' + n.title + ' | ' + (n.role || '人类') + ' | ' +
        String(ask).replace(/\|/g,'/').slice(0,60) + ' | ' + (n.checked ? '已确认' : '待确认') + ' |');
    });
  } else {
    L.push('_（本工作流未设置人工卡点，Agent 可连续执行到底）_');
  }
  L.push('');
  L.push('## 六、给 Agent 的执行规则');
  L.push('');
  L.push('1. 严格按「三、执行顺序」推进，不得跳步、不得并行、不得自行合并节点。');
  L.push('2. 每步产出必须同时满足该节点的「输出契约」与「验收标准」；不满足就回到该节点重做。');
  L.push('3. 遇到人工卡点必须停止，输出「请确认：第 N 步 …」，等待人类明确回复后再继续。');
  L.push('4. 严格遵守各节点的「禁止事项」与「全局约束」；两者冲突时以全局约束为准。');
  L.push('5. 每完成一步输出一行进度：`[第N步/共' + wf.nodes.length + '步] 节点名 → 产出摘要`。');
  L.push('6. 最终交付必须完整覆盖「最终交付物」列出的全部内容，缺一不可。');
  L.push('7. 遇到节点未定义的自主决策，一律先提问确认，不要假设。');
  L.push('');
  L.push('## 七、回灌与校验');
  L.push('');
  L.push('- 本交接包对应的结构化文件为 `' + safeFileName(wf.name) + '.workflow.json`，可用于程序化解析与二次编排。');
  L.push('- 把该 JSON 粘贴回工作流编排台的「导入回灌」，即可继续可视化编辑。');
  L.push('- 本次导出时结构校验结果：' + (v.ok ? '✅ 通过' : '❌ 未通过'));
  v.errors.forEach(e => L.push('  - ❌ ' + e.msg));
  v.warnings.forEach(e => L.push('  - ⚠ ' + e.msg));
  if (v.infos.length) L.push('  - 另有 ' + v.infos.length + ' 条优化建议');
  L.push('');
  return L.join('\n');
}

/* ---------- 导出面板渲染 ---------- */
function renderExportPanel(){
  const bd = document.getElementById('expBd');
  const ft = document.getElementById('expFt');
  if (!bd || !ft) return;
  const wf = getActiveWf();
  document.querySelectorAll('.tabs button').forEach(b=>{
    b.classList.toggle('on', b.getAttribute('data-tab') === UI.exportTab);
  });
  if (!wf){ bd.innerHTML = '<div class="empty">没有工作流</div>'; ft.innerHTML = ''; return; }

  if (UI.exportTab === 'check'){
    const v = validateWorkflow(wf);
    const all = v.errors.concat(v.warnings).concat(v.infos);
    bd.innerHTML =
      '<div class="check-sum">' +
        '<div class="check-pill">' + icon('alert') + '<div><b style="color:' + (v.errors.length?'#ef4444':'#5fd68a') + '">' + v.errors.length + '</b><i>结构错误</i></div></div>' +
        '<div class="check-pill">' + icon('alert') + '<div><b style="color:' + (v.warnings.length?'#f59e0b':'#5fd68a') + '">' + v.warnings.length + '</b><i>待优化警告</i></div></div>' +
        '<div class="check-pill">' + icon('sparkle') + '<div><b>' + v.score + '</b><i>完整度评分</i></div></div>' +
      '</div>' +
      (all.length
        ? '<div class="issue-list">' + all.map(it =>
            '<div class="issue ' + it.level + '">' +
              '<span class="ico" style="color:' + LV_COLOR[it.level] + '">' + svgIcon(LV_ICON[it.level]) + '</span>' +
              '<span>' + esc(it.msg) + '</span>' +
              '<span class="top-sp"></span>' +
              (it.nodeId ? '<button class="btn btn-sm" data-act="goto-node" data-id="' + it.nodeId + '">定位节点</button>' : '') +

      '<div class="fmt-note">' + svgIcon('help') +

      '<div class="code-box">' + hlJson(text) + '</div>';

/* JSON 展示用轻量高亮（仅用于阅读，复制走的仍是原始文本） */
function hlJson(s){
  return esc(s)
    .replace(/&quot;([^&\n]*?)&quot;(\s*:)/g, '<span class="k">&quot;$1&quot;</span>$2')
    .replace(/:\s*&quot;([^&\n]*?)&quot;/g, ': <span class="s">&quot;$1&quot;</span>')
    .replace(/:\s*(-?\d+(?:\.\d+)?)/g, ': <span class="h">$1</span>')
    .replace(/:\s*(true|false|null)/g, ': <span class="k">$1</span>');
}

/* ---------- 导入 ---------- */
function doImport(text){
  const raw = String(text||'').trim();
  if (!raw){ toast('请先粘贴 JSON 内容','warn'); return; }
  let obj = null;
  try { obj = JSON.parse(raw); }
  catch(e){ toast('解析失败：不是合法的 JSON','err'); return; }

  const incoming = [];
  if (Array.isArray(obj.workflows)) incoming.push(...obj.workflows);
  else if (obj.workflow) incoming.push(obj.workflow);
  else if (obj.nodes || obj.name) incoming.push(obj);
  if (!incoming.length){ toast('这份 JSON 里没有找到工作流','err'); return; }

  let added = 0;
  incoming.forEach(w => {
    if (!w || (!w.nodes && !w.name)) return;
    /* 交接包/导出文件不带坐标，导入时自动排布，避免节点全部叠在左上角 */
    const hasCoords = Array.isArray(w.nodes) && w.nodes.length > 0 &&
      w.nodes.every(n => typeof n.x === 'number' && typeof n.y === 'number');
    const nw = normalizeDB({ workflows:[w], activeWfId:'' }).workflows[0];
    nw.id = uid('wf');
    nw.name = (nw.name || '导入的工作流') + '（导入）';
    nw.nodes.forEach(n => { n.id = uid('n'); });
    const idm = {};
    const src = (w.nodes || []);
    src.forEach((sn,i) => { if (nw.nodes[i]) idm[sn.id] = nw.nodes[i].id; });
    nw.edges = (nw.edges || []).map(e => ({ id:uid('e'), from:idm[e.from]||e.from, to:idm[e.to]||e.to, label:e.label||'' }))
      .filter(e => nw.nodes.some(n=>n.id===e.from) && nw.nodes.some(n=>n.id===e.to));
    if (!hasCoords) layoutWorkflow(nw);
    nw.createdAt = nowISO(); nw.updatedAt = nowISO();
    DB.workflows.push(nw);
    DB.activeWfId = nw.id;
    added++;
  });

  if (!added){ toast('没有可导入的工作流','err'); return; }
  setSel([]);
  saveData(true); commit('import');
  UI.exportOpen = false;
  document.getElementById('mask').classList.remove('on');
  refreshAll();
  toast('已导入 ' + added + ' 份工作流');
}

function scrollToNode(id){
  const scroll = document.getElementById('canvasScroll');

  if (!scroll || !stage) return;
  const el = stage.querySelector('.node[data-node-id="' + id + '"]');
  const wf = getActiveWf();

  const z = DB.ui.zoom || 1;

  try { scroll.scrollTo({ left:left, top:top, behavior:'smooth' }); }
  catch(e){ scroll.scrollLeft = left; scroll.scrollTop = top; }
}

/* 多选节点的对齐操作 */
function alignSelected(mode){
  const wf = getActiveWf();
  const list = selNodes();
  if (!wf || list.length < 2){ toast('至少选中 2 个节点才能对齐','warn'); return; }
  const xs = list.map(n => n.x), ys = list.map(n => n.y);
  if (mode === 'left')   list.forEach(n => { n.x = Math.min.apply(null, xs); });
  if (mode === 'right')  list.forEach(n => { n.x = Math.max.apply(null, xs); });
  if (mode === 'top')    list.forEach(n => { n.y = Math.min.apply(null, ys); });
  if (mode === 'hgap' || mode === 'vgap'){
    const sorted = list.slice().sort((a,b) => mode === 'hgap' ? a.x - b.x : a.y - b.y);
    const first = sorted[0], last = sorted[sorted.length - 1];
    if (mode === 'hgap'){
      const step = (last.x - first.x) / (sorted.length - 1);
      sorted.forEach((n,i) => { n.x = Math.round(first.x + step * i); });
    } else {
      const step = (last.y - first.y) / (sorted.length - 1);
      sorted.forEach((n,i) => { n.y = Math.round(first.y + step * i); });
    }
  }
  touchWf(wf); saveData(true); commit('align'); refreshAll();
  toast('已对齐');
}

function reaches(from, to, wf){
  if (from === to) return true;
  const { adj } = buildAdj(wf);
  const seen = {}, stack = [from];
  while (stack.length){
    const u = stack.pop();
    if (u === to) return true;
    if (seen[u]) continue;
    seen[u] = 1;
    (adj[u] || []).forEach(v => stack.push(v));
  }
  return false;
}

function createEdge(from, to){
  const wf = getActiveWf();
  if (!wf || from === to) return;
  if (wf.edges.some(e => e.from === from && e.to === to)){ toast('这两个节点之间已经有连线了','warn'); return; }
  if (reaches(to, from, wf)){ toast('不能这样连：会让流程形成死循环','err'); return; }
  wf.edges.push({ id:uid('e'), from:from, to:to, label:'' });
  touchWf(wf); saveData(true); commit('link'); refreshAll();
  toast('已连线');
}

function tryDeleteEdge(edgeId){
  const wf = getActiveWf();

  if (!e) return;
  const a = getNode(wf, e.from), b = getNode(wf, e.to);
  if (!confirm('删除连线「' + ((a && a.title) || '?') + ' → ' + ((b && b.title) || '?') + '」？')) return;
  wf.edges = wf.edges.filter(x => x.id !== edgeId);
  touchWf(wf); saveData(true); commit('unlink'); refreshAll();
  toast('已删除连线');
}

/* 纯布局计算：按拓扑层次重排节点坐标（导入无坐标的工作流时也会用到） */
function layoutWorkflow(wf){
  if (!wf || !wf.nodes.length) return false;
  const order = topoSort(wf);
  const level = {};
  order.forEach(id => {
    const ups = inEdgesOf(wf, id).map(e => e.from);
    level[id] = ups.length ? Math.max.apply(null, ups.map(u => (level[u] || 0) + 1)) : 0;
  });
  const byLv = {};
  order.forEach(id => { const L = level[id]; (byLv[L] = byLv[L] || []).push(id); });
  const GAP_Y = 158, GAP_X = 258;
  let maxCount = 1;
  Object.keys(byLv).forEach(L => { maxCount = Math.max(maxCount, byLv[L].length); });
  const canvasW = maxCount * GAP_X;
  Object.keys(byLv).forEach(L => {
    const ids = byLv[L];
    const rowW = ids.length * GAP_X - (GAP_X - NODE_W);
    const startX = Math.max(24, (canvasW - rowW) / 2 + 24);
    ids.forEach((id, i) => {
      const n = getNode(wf, id);
      if (!n) return;
      n.x = Math.round(startX + i * GAP_X);
      n.y = 34 + Number(L) * GAP_Y;
    });
  });
  return true;
}

  layoutWorkflow(wf);

/* 缩放：opts.cx / opts.cy 传入时，保持该屏幕点下的内容不动（Ctrl+滚轮的锚点缩放） */
function setZoom(z, opts){
  const nz = Math.min(1.8, Math.max(0.4, Math.round(z * 100) / 100));
  const cur = DB.ui.zoom || 1;
  if (nz === cur) return;
  const scroll = document.getElementById('canvasScroll');
  const rect = scroll ? scroll.getBoundingClientRect() : null;
  let vx = null, vy = null, sx = null, sy = null;
  if (scroll && rect && opts && opts.cx != null){
    vx = opts.cx - rect.left;
    vy = opts.cy - rect.top;
    sx = (scroll.scrollLeft + vx) / cur;
    sy = (scroll.scrollTop + vy) / cur;
  }
  DB.ui.zoom = nz;
  saveData();
  refreshAll();
  if (scroll && sx != null){
    scroll.scrollLeft = sx * nz - vx;
    scroll.scrollTop  = sy * nz - vy;
  }
}
function zoomStep(delta, opts){ setZoom((DB.ui.zoom || 1) + delta, opts); }
function zoomBy(delta){ zoomStep(delta); }

/* 适应视图：缩放并滚动到刚好容纳全部节点 */
function fitView(){
  const wf = getActiveWf();
  const scroll = document.getElementById('canvasScroll');
  if (!wf || !wf.nodes.length || !scroll){ setZoom(1); return; }
  let maxX = 0, maxY = 0, minX = 1e9, minY = 1e9;
  wf.nodes.forEach(n => {
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + NODE_W); maxY = Math.max(maxY, n.y + 130);
  });
  const pad = 56;
  const w = (maxX - minX) + pad * 2, h = (maxY - minY) + pad * 2;
  const z = Math.min(1.4, Math.max(0.4, Math.min(scroll.clientWidth / w, scroll.clientHeight / h)));
  setZoom(z);
  scroll.scrollLeft = Math.max(0, (minX - pad) * (DB.ui.zoom || 1));
  scroll.scrollTop  = Math.max(0, (minY - pad) * (DB.ui.zoom || 1));
}
